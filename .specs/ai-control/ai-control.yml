schema: v0.1

purpose:
  outcome: Let an AI client on the same computer read and change SnappyRef through a small set of MCP tools, with the user deciding how much it may do.
  owns:
    - The access level and what each level allows.
    - The tool catalogue, its vocabulary, and the JSON an AI client reads back.
    - The local endpoint the `--mcp` role and the app meet on.
    - Turning one tool call into the app's own operations.
  excludes:
    - What an edit means, which Board Document, Grouping, Spatial Layout, and Placement Creation own.
    - Import decoding, Semantic Search indexing, and PureRef mapping.
    - App updates. No tool checks for, downloads, or installs one.
    - Crop. No tool sets or clears it.
    - Access from another computer.

interface:
  operations:
    set-access:
      description: The user chooses how much AI clients may do.

      input:
        access:
          type: AiControlAccess
          description: Off, Ask, or Full. Off on a new Library.

      outcomes:
        off: {}
        ask: {}
        full: {}

      behavior:
        off-by-default: A new Library must start at Off, with nothing listening.
        user-only: Only the user changes the access level, in Settings. No tool changes it.
        off-withdraws-endpoint: Choosing Off must remove the endpoint file and stop the listener at once.
        ask-confirms-permanent: At Ask, removing Library images and installing or removing the search model must wait for the user's answer in the app's own confirmation dialog.
        full-skips-confirmation: At Full, those calls must run without a dialog.
        dialog-names-the-asker: A dialog raised for a call must say an AI client asked for it.
        one-dialog: A call that needs a dialog while another dialog is open must fail instead of queueing.

      caller_obligations: {}

    call-tool:
      description: Runs one tool call from an AI client and answers it.

      input:
        tool:
          type: String
          description: A name from the tool catalogue.
        arguments:
          type: Object
          description: The tool's arguments. Unknown fields are refused.

      outcomes:
        answered:
          result: Object
        refused:
          reason: String

      behavior:
        ui-thread: Every call must run on the UI thread between frames, through the operations the user's own input reaches.
        never-blocks-a-frame: A call that waits on import, search, a screenshot, an export, or the user must be polled across frames and must not block one.
        ids-not-selection: Edits name their targets by id. No edit depends on or changes what the user has selected, except the `select` tool.
        one-call-one-undo: One `edit_board` call must be one Undo step, however many edits it carries.
        checked-before-applied: Every edit in a call must be checked against the Board before the first one applies. A call that fails the check changes nothing.
        results-report-final-geometry: `edit_board` must return every item and Group it touched as they ended up, after Group layout.
        refs-name-new-items: An edit may name the item or Group it creates, and later edits in the same call may refer to it by that name.
        errors-say-what-to-do: A refusal must name the edit and field at fault and what would be accepted.
        user-vocabulary: Tool names, argument names, and results use the words the app shows the user.

      caller_obligations: {}

    connect:
      description: The `--mcp` role reaches the app that owns the Library.

      input:
        library_root:
          type: Path
          description: The Library root both processes resolve from the same environment.

      outcomes:
        connected: {}
        access-off: {}
        launch-timed-out: {}

      behavior:
        loopback-only: The app must listen on 127.0.0.1 only, on a port the OS picks.
        token-required: A connection must send the token from the endpoint file before any call. A wrong token is dropped.
        endpoint-file-private: The endpoint file must be readable by the user only where the platform supports it.
        catalogue-without-app: Listing tools must work while the app is closed.
        launches-when-on: With access on and no app answering, a tool call must start the app and wait for it.
        never-launches-when-off: With access Off, a tool call must explain where to turn access on and must not start the app.

      caller_obligations: {}

  guarantees:
    same-result-as-the-user: A change made through a tool is the change the user would have made by hand. It persists, reloads, and undoes the same way.
    no-remote-access: Nothing in AI control accepts a connection from another computer.

  requires:
    board-edits:
      target: "[[board-document#/interface/operations/apply-change/outcomes/applied]]"
      reason: Every tool edit enters history and persistence as a Board Document change.
    library-root:
      target: "[[local-data-location#/interface/operations/resolve-library-root/outcomes/resolved]]"
      reason: Both processes resolve the same Library root to find the endpoint file.

decisions:
  document-tools:
    current: One read tool returns the Board as JSON, and one edit tool takes a batch of edits addressed by id.
    affects:
      - "[[#/interface/operations/call-tool]]"
    reasons:
      - Prototyped against the same board tasks, this shape took 14 calls and no errors. One tool per action took 24. Mirroring the UI with select-then-command took about 87 and made 9 errors.
      - A batch maps onto one Undo step, which is how the user thinks about an AI's turn.
    consequences:
      - `edit_board` has a long description, because it carries most of the vocabulary.
    reconsider_when:
      - Clients stop reading long tool descriptions.
    explored_paths:
      one-tool-per-action:
        status: rejected
        reason: More calls, and no way to make several changes one Undo step.
      select-then-command:
        status: rejected
        reason: The client spends most calls moving the selection, and it clobbers the user's own.
    sources: []

  stdio-role-over-loopback:
    current: AI clients start `snappyref --mcp`, which speaks MCP on stdio and forwards each call to the app over a loopback socket.
    affects:
      - "[[#/interface/operations/connect]]"
    reasons:
      - Every MCP client can start a stdio command. No port or URL to configure.
      - The app keeps one binary and one role flag per job.
    consequences:
      - Two apps on one Library root overwrite each other's endpoint file. The last one started answers.
    reconsider_when:
      - Clients need to reach SnappyRef from a sandbox that cannot start local commands.
    explored_paths:
      http-server-in-app:
        status: rejected
        reason: Needs a fixed port and cannot launch the app when it is closed.
    sources: []

  access-levels:
    current: Off by default. Ask confirms calls that Undo cannot reverse. Full confirms nothing.
    affects:
      - "[[#/interface/operations/set-access]]"
    reasons:
      - A local listener that edits user data must be something the user turned on.
      - Board edits are undoable, so confirming each one would add friction without protecting anything.
      - Full exists for unattended and development use.
    consequences:
      - At Ask a call can wait up to a minute on the user and then fail.
    reconsider_when:
      - A tool is added whose effect Undo cannot reverse.
    explored_paths: {}
    sources: []
