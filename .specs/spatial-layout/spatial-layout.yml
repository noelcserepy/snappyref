schema: v0.1

purpose:
  outcome: Place and adjust Placements with predictable spacing, alignment, and collision behavior.
  owns:
    - Placement Gap semantics.
    - Guide snapping for movement, resize, and uniform scale.
    - Compact, row, and column arrangement.
    - Ordered Group auto-layout, container sizing, and incoming Placement fitting.
    - Directional packing within a Placement selection.
    - Alignment guide results.
  excludes:
    - Pointer and keyboard interpretation.
    - Placement persistence and history.
    - Group identity, naming, and membership mutation.
    - Placement creation and content resolution.

interface:
  operations:
    snap:
      description: Adjusts a proposed Placement transform against nearby eligible Placements.

      input:
        request:
          type: PlacementSnapRequest
          description: A move, resize, or uniform-scale proposal with current Board geometry, viewport, and Placement Gap.

      outcomes:
        snapped:
          geometry: RectGeometrySet
          guides: AlignmentGuides
        unchanged:
          geometry: RectGeometrySet
          guides: AlignmentGuides
        rejected:
          reason: SpatialLayoutRejection

      behavior:
        nearby-candidates-only: Snapping must consider only relevant nearby or viewport-visible candidates.
        group-bounds: A multi-Placement move must snap the selection bounds as one unit.
        gap-aware-contact: Edge contact must respect Placement Gap.
        edge-center-and-gap-guides: Snapping must consider matching edges, centers, and Placement Gap spacing.
        screen-space-threshold: Snap acquisition and release thresholds must remain stable in screen space across zoom levels.
        release-hysteresis: A previously acquired snap must use a wider release threshold than its acquisition threshold.
        co-winning-guides: Guides must report every equal alignment that produces the chosen nudge.
        transform-specific: Resize and uniform scale must preserve the requested transform semantics.

      caller_obligations:
        current-board-geometry: Supply current geometry for relevant Board Placements.

    arrange:
      description: Arranges a non-empty Placement selection using a named layout.

      input:
        request:
          type: PlacementArrangementRequest
          description: The selected Placements, Compact, Row, or Column layout, anchor, and Placement Gap.

      outcomes:
        arranged:
          geometry: RectGeometrySet
        unchanged:
          geometry: RectGeometrySet
        rejected:
          reason: SpatialLayoutRejection

      behavior:
        deterministic: The same request must produce the same geometry.
        no-overlap: arranged must not overlap selected Placements.
        requested-gap: arranged must apply Placement Gap between neighboring Placements.
        compact-squareish: Compact must prefer a square-like footprint with few internal holes and clean top and left edges.
        compact-right-edge-secondary: Compact must prefer clean top and left edges over a regular right edge.
        compact-near-equal-normalization: Compact must normalize near-equal displayed sizes when that reduces visible drift, while preserving aspect ratios.
        compact-rectangle-like: Compact must avoid degenerate single-column or single-row output when a materially more balanced rectangle exists.
        selection-frame-preserved: Arrangement must place the result relative to the supplied anchor without an unrelated canvas jump.
        aspect-preserved: Arrangement must preserve each Placement aspect ratio.

      caller_obligations:
        non-empty-selection: Supply at least one Placement.

    layout-group:
      description: Computes an ordered Group layout for creation or a change to its members, configuration, or container.

      input:
        request:
          type: GroupLayoutRequest
          description: Ordered image and textbox geometries, container geometry, flow, axis modes, member sizing intent, gaps, padding, alignment, clipping, and the requested change.

      outcomes:
        laid-out:
          layout: GroupLayout
        unchanged:
          layout: GroupLayout
        rejected:
          reason: SpatialLayoutRejection

      behavior:
        default-flow: A new Group must default to Wrap, Fixed width from selection bounds plus padding, Hug height, numeric and row gaps and padding from Placement Gap, Start alignment, and clipping off.
        outer-and-usable-size:
          statement: Displayed container dimensions are outer sizes and must remain positive and finite; usable capacity on each axis is the maximum of zero and outer size minus twice padding, including when padding exhausts a Fixed axis.
          checks:
            - grouping_outer_size_and_usable_capacity
            - grouping_padding_exhausts_fixed_capacity
        member-footprint: Layout must use rotated visual bounds as each member footprint.
        fill-allocation:
          statement: Each row divides nonnegative capacity remaining after Fixed footprints and numeric gaps equally among primary-axis Fill cells, using zero minimum Fill width for Wrap row breaks and zero numeric gap under Auto.
          checks:
            - grouping_numeric_fill_and_overflow_examples
        image-fill: One Fill axis determines image scale by its ratio; two Fill axes aspect-fit the image within its allocated cell, while textboxes stretch Fill axes independently.
        zero-fill-result: Exhausted Fill cells must produce nonnegative dimensions, including zero, accepted under Placement's contextual geometry contract.
        auto-distribution:
          statement: After Fill allocation, Between distributes leftover only between members, Evenly equally at both ends and between, and Around with half an inter-member share at each end; a lone member starts under Between and centers under Evenly or Around.
          checks:
            - grouping_auto_spacing_examples
        wrap-arrow-target: Wrap vertical navigation must resolve the member in the same column of the adjacent row, or no target when that row or column is absent.
        hug-envelope: Hug must contain flowing member bounds plus padding, including Free manual bounds, while empty Groups retain their last container size.
        free-geometry: Free must preserve manual positions and ignore flow spacing, Auto, alignment and Fill until ordered flow resumes.
        absolute-geometry: Absolute members must preserve top-left-relative offsets and stay outside flow and Hug calculations.
        insertion-slot: Drag insertion and restoring an Absolute member to flow must resolve the nearest ordered slot from its center.
        row-flow: Row must place members in their supplied order along one horizontal row.
        column-flow: Column must place members in their supplied order along one vertical column.
        wrap-flow: Wrap must place members left to right in supplied order, starting a new row when the next member does not fit the available width.
        wrap-height: Hug height contains the Wrap row stack plus padding. Fixed height stays fixed and allows overflow.
        group-gap: Numeric primary gap controls neighbor distance and Wrap row gap controls row distance. Both allow negative values. Auto distributes primary leftover after Fill. Padding insets usable capacity.
        ordered-not-packed: Row, Column, and Wrap preserve member order. Wrap uses zero minimum width for Fill members, then divides each row leftover among Fill members. Free preserves manual positions.
        append-stable: Adding preserves existing positions only when members are Fixed, gap is numeric, and both alignments are Start. Auto spacing, Fill, and other alignment may move existing members.
        append-location: Appended members must continue at the end of the layout, filling the last Wrap row before starting another row.
        remove-closes-gap: Removing a member must close its space in the ordered flow. Reordering must lay out the new supplied order.
        size-preserved: Fixed members keep sizes during reflow. Fill derives sizes from available cells. Images keep their ratio; textboxes stretch independently.
        incoming-fit: Fit only newly arriving all-Fixed, non-absolute members to a Fixed usable width in Row, Column, or Wrap. Preserve image ratios. Free and Hug width do not fit intake.
        incoming-fit-isolated: Incoming fitting never enlarges an arrival or changes existing member stored sizes or modes. Existing Fill geometry may change with layout.
        resize-not-scale: Resizing sets the touched axis Fixed and reflows. Fixed members preserve dimensions; Fill recomputes its available share.
        fixed-member-overflow: A member wider than the available width after container resizing must retain its size and overflow rather than shrink automatically.
        uniform-scale-distinct: Explicit uniform scaling must scale the container, members, numeric and row gaps, and padding together while preserving relative geometry, rather than perform a container resize.
        empty-valid: An empty Group must have a valid layout and retain the configuration needed for later additions.
        deterministic: The same request must produce the same Group layout.
        invalid-geometry-rejected: Non-finite dimensions, gaps or padding, negative padding, and non-positive container dimensions produce rejected. Negative numeric and row gaps are valid.

      caller_obligations: {}

    settle:
      description: Packs selected Placements toward one edge of their existing selection bounds.

      input:
        request:
          type: DirectionalSettleRequest
          description: The non-empty selection, direction, and Placement Gap.

      outcomes:
        settled:
          geometry: RectGeometrySet
        unchanged:
          geometry: RectGeometrySet
        rejected:
          reason: SpatialLayoutRejection

      behavior:
        direction-preserved: settled must move Placements only along the requested direction.
        selection-bounds-anchor: The leading Placement must settle against the requested edge of the selection's original bounds.
        independently-packed: Remaining selected Placements must settle independently against the edge or already settled selected Placements.
        orthogonal-coordinate-preserved: Each Placement must preserve its coordinate on the axis perpendicular to the settle direction.
        first-selected-blocker: Each Placement must stop at the first already settled selected Placement whose perpendicular span overlaps within the gap policy.

      caller_obligations:
        non-empty-selection: Supply at least one Placement.

  guarantees:
    group-sizing:
      statement: Fill requires a Fixed parent axis; entering Hug freezes Fill at rendered size on that axis and restores the last numeric primary gap if that axis is primary, while changing Fill to Fixed freezes its rendered size.
      checks:
        - src/grouping/tests.rs::sizing::auto_hug_conversion
        - src/grouping/tests.rs::sizing::edit_constraints
        - src/grouping/tests.rs::sizing::transfer_fill_to_hug
        - src/grouping/tests.rs::stored_auto_variant_and_number
    group-mode-admission: Wrap must refuse Hug width without changing flow; Free and Absolute keep sizing intent dormant and refuse member sizing edits; Auto fixes the primary axis at its current rendered size and Off restores the last numeric gap.
    group-mode-conversion: Changing flow must preserve explicit sizing choices except that Wrap requires Fixed width and active Auto requires a Fixed primary axis; transfer must preserve compatible Fill intent and freeze incompatible axes at rendered size.
    group-control-context: Numeric gap editing must be inactive in Free or Auto; row gap is available only in Wrap, alignment is inactive in Free, and member sizing is inactive in Free or Absolute while saved values remain intact.
    group-disabled-admission: A hidden or disabled sizing control must reject without modifying unrelated settings to enable itself; under Auto only counter-axis alignment choices at the saved primary coordinate remain active.
    group-gap-and-alignment: Numeric gaps and Wrap row gaps may be negative. Fill consumes leftover before Between, Evenly, or Around distributes it. Nine-position alignment places remaining content and the Wrap row stack.
    group-absolute-and-clip: Clipping must not change layout geometry or the container used for Group hit testing.
    one-gap-meaning: Placement Gap has the same edge-to-edge meaning in snapping, arrangement, settling, and initial placement. Group gap uses that same meaning with a Group-owned value.
    geometry-only: Spatial Layout must not mutate Asset content, Board history, or persistence.
    repeatable-results: Repeating an already satisfied arrangement, Group layout, or settle request must produce unchanged.

  requires:
    placement-geometry:
      target: "[[placement#/interface/operations/change-geometry/behavior/zero-fill-geometry]]"
      reason: Owns valid zero Fill display geometry and image recovery through history and persistence.

decisions:
  shared-placement-gap:
    current: Use the shared Placement Gap for ungrouped spatial operations and each Group's own spacing for its auto-layout. Both measure edge-to-edge distance.
    affects:
      - "[[#/interface/operations/snap]]"
      - "[[#/interface/operations/arrange]]"
      - "[[#/interface/operations/settle]]"
      - "[[#/interface/operations/layout-group/behavior/group-gap]]"
      - "[[#/interface/guarantees/one-gap-meaning]]"
    reasons:
      - Different import, snap, and arrangement gaps made Placement spacing unpredictable.
      - Shared spacing keeps ungrouped automatic and manual layout consistent, while Groups need independently editable layout configuration.
    consequences:
      - A zero value permits direct edge contact.
      - Initial placement and later layout use the same spacing policy.
      - Group layout reads its saved gaps and padding rather than changing other Groups or ungrouped layout settings.
    reconsider_when:
      - A spatial operation needs a distinct user-visible spacing concept.
    explored_paths:
      import-only-gap:
        status: superseded
        reason: The gap also governs snapping and later arrangement, so import vocabulary was too narrow.
    sources: []

  group-layout-model:
    current: Groups support Row, Column, Wrap, and Free. Axes independently Hug or stay Fixed. Wrap width stays Fixed. Uniform scale remains a separate operation.
    affects:
      - "[[#/interface/operations/layout-group]]"
    reasons:
      - Adding a reference must append it predictably without rearranging existing references for density.
      - Container width controls flow rather than silently changing the sizes of existing references.
    consequences:
      - Removing, reordering, or resizing can shift members through the flow.
      - Narrowing a container can leave an existing fixed-size member overflowing.
      - Oversized incoming references fit on addition without resizing existing members.
    reconsider_when: []
    explored_paths:
      compact-repacking:
        status: rejected
        reason: Density-based packing can rearrange every reference when one is added.
      scale-only-container:
        status: rejected
        reason: It prevents container resizing from controlling the flow of references.
    sources: []

  exhausted-padding-capacity:
    current: Allow positive outer container dimensions even when padding leaves zero usable capacity.
    affects:
      - "[[#/interface/operations/layout-group/behavior/outer-and-usable-size]]"
    reasons:
      - Padding changes usable capacity without making a positive outer container invalid.
      - The same nonnegative Fill allocation handles exhaustion by padding and by Fixed siblings.
    consequences:
      - Fixed members may overflow and Fill may reach zero.
    reconsider_when:
      - Zero usable capacity cannot remain finite and recoverable while outer geometry remains valid.
    examples:
      - given: A Fixed outer width of 100 with padding 50.
        when: The user submits that padding.
        then: The edit succeeds with zero usable width and the outer width stays 100.
    explored_paths:
      reject-exhausted-padding:
        status: rejected
        reason: It confuses valid outer geometry with available layout capacity.
    sources: []
