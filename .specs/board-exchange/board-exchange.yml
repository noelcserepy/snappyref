schema: v0.1

purpose:
  outcome: Move whole Boards between SnappyRef and PureRef `.pur` files without blocking interaction or silently losing what can't be carried over.
  owns:
    - Mapping between PureRef items and notes and SnappyRef Placements and textboxes.
    - Storing the originals and crops an imported PureRef board shows.
    - Choosing which Board content an export writes and reporting what it leaves out.
  excludes:
    - The `.pur` binary format, which the PureRef file codec owns.
    - Board creation, history, and persistence.
    - Active Board activation.
    - Clipboard PureRef references, which Clipboard Exchange and Placement Creation own.
    - The native save panel and platform drop delivery.

interface:
  operations:
    import:
      description: Opens one dropped `.pur` file as a new active Board.

      input:
        file:
          type: Path
          description: A dropped file with a `.pur` extension.

      outcomes:
        imported:
          board: BoardSummary
          placements: Integer
          textboxes: Integer
          flipped: Integer
          skipped: Integer
        rejected:
          reason: BoardExchangeFailure

      behavior:
        off-interaction-path: Reading the file, decoding images, and storing originals and crops must run off the UI thread.
        no-provisional-preview: Hovering or dropping a `.pur` file must not create provisional or committed Placements on the current Board.
        named-after-file: imported must name the new Board after the file stem.
        geometry-preserved: Each image item's crop corners must land where PureRef draws them, through position, uniform or non-uniform scale, and rotation.
        stack-preserved: Images keep PureRef's back-to-front order, and notes stack above every image.
        crops-stored: An item showing part of its image must get a cropped original of exactly those pixels. Items that show the same image with the same crop share one Asset.
        notes-become-textboxes: Each note must become a textbox centred where PureRef centres the note, with the nearest textbox text size. PureRef stores no note box size, so the textbox is sized to hold its text unwrapped at the zoom the Board opens at.
        losses-reported: The status must count mirrored items imported unmirrored and items whose image was missing or undecodable.
        one-board-create: imported must enter Board Document as one create-board with a seed, so one Undo removes the Board and returns to the previous active Board.
        content-framed: The new Board's viewport must frame all imported content.

      caller_obligations: {}

    export:
      description: Writes the active Board to a `.pur` file the user chose.

      input:
        board:
          type: BoardDocument
          description: A snapshot of the active Board taken when the user asked to export.
        file:
          type: Path
          description: The destination the user picked in the save panel.

      outcomes:
        exported:
          images: Integer
          notes: Integer
          skipped_images: Integer
          skipped_annotations: Integer
        empty: {}
        cancelled: {}
        rejected:
          reason: BoardExchangeFailure

      behavior:
        off-interaction-path: Reading originals and writing the file must run off the UI thread.
        originals-embedded: Each loaded Placement's original bytes must be embedded once per Asset, unchanged.
        geometry-preserved: Each item's transform must draw the original over its Placement's rotated, scaled rect.
        textboxes-become-notes: Each textbox must become a note centred on the textbox, scaled to its text size.
        unsupported-left-out: Lines, arrows, and images in formats PureRef can't open must be left out and counted in the status.
        atomic-write: A failed write must not leave a partial file at the destination.
        empty-no-dialog: A Board with nothing to export must report that without opening the save panel.

      caller_obligations: {}

  guarantees:
    round-trip: Exporting a Board and importing the file must reproduce every exported Placement's center, scaled size, and rotation, and every textbox's text, text size, and center.
    board-document-delegated: Import creates its Board only through Board Document's create-board and activates it through Active Board.
    library-delegated: Imported originals and crops register through the Library, which reuses exact duplicates.

  requires:
    board-creation:
      target: "[[board-document#/interface/operations/create-board/outcomes/created]]"
      reason: Persists the seeded Board and records it as one undoable lifecycle entry.
    original-registration:
      target: "[[local-library#/interface/operations/register-original/outcomes/registered]]"
      reason: Registers imported originals and crops and reuses exact duplicates.

decisions:
  new-board-per-file:
    current: A dropped `.pur` file always opens as a new Board instead of adding its images to the current Board.
    affects:
      - "[[#/interface/operations/import]]"
    reasons:
      - A `.pur` file is a whole board with its own layout, and merging it would overlap the current Board's content.
      - One create-board keeps Undo to a single step.
    consequences:
      - Users who want the images on an existing Board copy them across after import.
    reconsider_when:
      - Users ask to merge PureRef boards into an existing Board.
    explored_paths:
      merge-into-active-board:
        status: rejected
        reason: Imported world coordinates would collide with existing content and need a layout policy.
    sources: []

  lossy-mapping:
    current: Carry over what SnappyRef can show and report the rest. Mirrored items come in unmirrored, note rotation and opacity are dropped, and PureRef groups are flattened.
    affects:
      - "[[#/interface/operations/import]]"
      - "[[#/interface/operations/export]]"
    reasons:
      - Placements have no flip or opacity, and textboxes have no rotation.
      - Refusing a whole board over one mirrored image would be worse than a counted loss.
    consequences:
      - A round trip through PureRef can lose mirroring, note rotation, and opacity.
    reconsider_when:
      - Placements gain flip or opacity, or textboxes gain rotation.
    explored_paths: {}
    sources: []
