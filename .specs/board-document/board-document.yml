schema: v0.1

purpose:
  outcome: Keep each named Board as a durable, undoable document with its own content, view, and history.
  owns:
    - Board identity and naming.
    - Placement and annotation membership.
    - Group identity, naming, ordered Placement membership, and saved auto-layout configuration.
    - Stack order across Board items.
    - Per-Board viewport and background state.
    - Document persistence.
    - Undo and redo history for committed document changes.
  excludes:
    - Asset storage.
    - Canvas input and visual interaction.
    - Spatial layout calculations.
    - Provisional batch orchestration.
    - Window, sidebar, recent Search, and global setting restoration.

interface:
  operations:
    create-board:
      description: Creates an empty named Board.

      input:
        name:
          type: BoardName
          description: The user-visible Board name.

      outcomes:
        created:
          board: BoardSummary
        rejected:
          reason: BoardRejection
        unavailable:
          retry_after: Duration?

      behavior:
        empty-document: created must produce a Board with no Placements, annotations, or Groups.
        durable-identity: created must assign a stable BoardId.
        default-view: created must include a usable default viewport at zoom 0.45 and a default Board background.
        history-recorded-once: created must add one undoable Board lifecycle history entry.

      caller_obligations: {}

    rename-board:
      description: Changes the user-visible name of one Board.

      input:
        board:
          type: BoardId
          description: The Board to rename.
        name:
          type: BoardName
          description: The new user-visible Board name.

      outcomes:
        renamed:
          board: BoardSummary
          history_entry: DocumentHistoryEntry
        unchanged:
          board: BoardSummary
        missing: {}
        rejected:
          reason: BoardRejection

      behavior:
        identity-preserved: renamed must preserve the BoardId and document content.
        history-recorded-once: renamed must add one undoable Board lifecycle history entry.
        no-history-for-noop: unchanged must not add a history entry.
        persistence-deferred: renamed must not wait for durable storage before returning.

      caller_obligations: {}

    list-boards:
      description: Lists the Boards in the workspace.

      input: {}

      outcomes:
        listed:
          boards: BoardCatalog
        unavailable:
          retry_after: Duration?

      behavior:
        stable-identities: listed must preserve each BoardId across restarts.

      caller_obligations: {}

    open-board:
      description: Opens the durable document for one Board.

      input:
        board:
          type: BoardId
          description: The Board to open.

      outcomes:
        opened:
          document: BoardDocument
        missing: {}
        unavailable:
          retry_after: Duration?

      behavior:
        complete-document: opened must include Placements, annotations, Groups, shared stack order, and the Board's viewport and background.
        transient-state-excluded: opened must not restore provisional Placements or active interaction state.

      caller_obligations: {}

    record-view:
      description: Records one Board's latest viewport and background outside document history.

      input:
        board:
          type: BoardId
          description: The Board whose view state changed.
        view:
          type: BoardViewState
          description: The latest viewport and background for the Board.

      outcomes:
        accepted: {}
        unchanged: {}
        missing: {}
        unavailable:
          retry_after: Duration?

      behavior:
        board-scoped: accepted must update only the supplied Board.
        history-neutral: accepted must not add a Document History entry.
        deferred-persistence: accepted must return before durable storage completes.
        latest-state-wins: Equivalent pending view writes may coalesce, but the latest accepted state must become durable.

      caller_obligations: {}

    apply-change:
      description: Applies one committed document change to a Board.

      input:
        board:
          type: BoardId
          description: The Board to change.
        change:
          type: BoardDocumentChange
          description: A closed document change over Placements, annotations, stack order, or Groups, including Group creation, naming, membership, member order, layout configuration, transforms, duplication, and ungrouping.

      outcomes:
        applied:
          document: BoardDocument
          history_entry: DocumentHistoryEntry
        unchanged:
          document: BoardDocument
        rejected:
          reason: BoardRejection
        missing: {}

      behavior:
        atomic-in-memory-change: applied must expose the whole logical change or none of it.
        history-recorded-once: applied must add one undoable history entry.
        no-history-for-noop: unchanged must not add a history entry.
        persistence-deferred: applied must not wait for durable storage before returning the changed document.
        group-creation: Creating a Group must assign a stable GroupId and an automatic editable name, and arrange the supplied Placements through Spatial Layout's Group layout operation.
        group-rename: Renaming a Group must preserve its identity, members, and layout configuration.
        group-add-existing: Adding to a Group must transfer existing Placements into that Group without creating duplicate Placements or Assets.
        group-append: Picker and context addition append. Drag-in inserts at the nearest slot. Paste and duplicate insert after the explicitly selected member, or append to the explicitly selected group.
        group-add-repeat-safe: Adding a Placement already in the destination Group must not duplicate or reorder that member.
        group-layout-coordination: Membership, member-size, member-order, container-size, and layout-configuration changes must apply Spatial Layout's Group layout result to each affected Group.
        group-change-atomic: A Group edit and its resulting membership, configuration, and geometry changes must form one document change and one history entry, including both Groups when a member transfers.
        group-member-removal: Removing or deleting a member must remove its membership before the remaining Group is laid out.
        group-empty-retained: Removing the last member must retain the Group's identity, name, and layout configuration as an available destination.
        group-ungroup: Ungrouping must remove the Group while preserving its member Placements and their current geometry.
        group-duplicate: Duplicating a Group must preserve its configuration, ordered membership, and relative member geometry while assigning new Group and Placement identities.

      caller_obligations: {}

    undo:
      description: Reverses the latest committed document change.

      input:
        board:
          type: BoardId
          description: The Board whose latest change to reverse.

      outcomes:
        undone:
          document: BoardDocument
        nothing-to-undo:
          document: BoardDocument
        missing: {}

      behavior:
        exact-reversal: undone must restore the document state before the reverted history entry.
        redo-created: undone must make the reverted entry available to redo.
        persistence-deferred: undone must return after the in-memory reversal and queue durable persistence.

      caller_obligations: {}

    redo:
      description: Reapplies the latest undone document change.

      input:
        board:
          type: BoardId
          description: The Board whose latest undone change to reapply.

      outcomes:
        redone:
          document: BoardDocument
        nothing-to-redo:
          document: BoardDocument
        missing: {}

      behavior:
        exact-reapplication: redone must restore the document state produced by the reapplied history entry.
        persistence-deferred: redone must return after the in-memory reapplication and queue durable persistence.

      caller_obligations: {}

    delete-board:
      description: Archives a Board and its document without removing Assets from the Library.

      input:
        board:
          type: BoardId
          description: The Board to remove.

      outcomes:
        deleted:
          history_entry: DocumentHistoryEntry
        missing: {}
        rejected:
          reason: BoardRejection
        unavailable:
          retry_after: Duration?

      behavior:
        assets-preserved: deleted must not remove Assets referenced by the Board.
        document-preserved: deleted must retain the archived Board identity, Placements, annotations, Groups, stack order, view state, and history for exact undo.
        history-recorded-once: deleted must add one undoable Board lifecycle history entry.
        repeat-safe: Deleting an already missing Board produces missing without another change.
        persistence-deferred: deleted must not wait for durable storage before returning.

      caller_obligations: {}

  guarantees:
    persistence-off-interaction-path: Durable writes must not block canvas interaction frames.
    latest-document-eventually-durable: After an accepted Board change returns, queued persistence must start automatically in the background and may complete before a flush. A flush must only wait for already queued writes. Coalescing must preserve the semantic order of changes.
    accepted-state-survives-write-failure: A failed durable write must leave the accepted in-memory document, Canvas identity, and history visible while persistence retries.
    accepted-document-coherent: Board lookup, catalog summaries, edit application, and content resolution must observe the same latest accepted Board state, including changes whose durable writes are pending or have failed.
    durable-write-atomic: A durable write must commit the complete document change, including Placements, Groups, ordered membership, layout configuration, shared stack order, identities, and history, or leave the prior durable state unchanged.
    durable-retry-idempotent: Retrying a failed durable write must not duplicate Placements, Groups, memberships, stack entries, identities, or history entries.
    complete-edit-ownership: Board Document must own accepted edit application, history recording or replay, required content reload scheduling, and ordered persistence submission. Callers must not coordinate these steps separately for an edit to be complete.
    self-contained-durable-change: A queued document change must carry the accepted content and geometry needed to persist it. Storage must not reconstruct Placement content by querying undo history.
    mixed-item-stack: Placements and annotations share one durable stack order.
    stable-total-stack-order: Every active Board item has one stable position in a total back-to-front order; creating an item places it at the front unless an explicit reorder is part of the same change.
    relative-order-preserved: Reordering a multi-item selection must preserve the selected items' relative order.
    provisional-history-neutral: Provisional Placements must not enter persistence or history before commit.
    history-isolated-per-board: Undo and redo for one Board must not consume entries created for another Board.
    content-format-upgrade: Upgrading persisted Loading and Failed Placement content from the old intent field to source must preserve content and undo/redo history, including archived Board history. Reopening an upgraded database must not require the old field alias. A failed conversion must leave prior durable records intact.
    history-survives-restart: Committed Board and Board-lifecycle history must remain available after app restart.
    archived-content-recoverable: Deleting a Board or Board item archives its durable content so Undo can restore the same identities.
    new-board-zoom: A Board without saved view state starts at zoom 0.45.
    group-board-local: A Group and every member Placement must belong to the same Board. Grouping must not change shared Library Assets.
    group-flat-membership: A Group contains an ordered set of images and textboxes, never lines, arrows, or other Groups. Each member belongs to at most one Group.
    group-auto-layout-only: Every Group has one layout configuration with Row, Column, Wrap, or Free flow. Free suspends layout while retaining valid sizing intent.
    group-durable-state: Group identity, name, ordered membership, geometry, flow, Hug or Fixed axes, numeric or Auto gap, row gap, padding, alignment, clipping, and member Fill and absolute intent survive restart and participate in history.

  requires:
    replay-image-preparation:
      target: "[[image-preparation#/interface/operations/prepare-asset]]"
      reason: Schedules display content required by accepted edits and history replay without asking document callers to coordinate image loading.
    placement-definition:
      target: "[[placement#/interface/operations/create/outcomes/created]]"
      reason: Defines the image-shaped document objects stored by a Board.
    group-layout:
      target: "[[spatial-layout#/interface/operations/layout-group]]"
      reason: Supplies Group geometry and configuration defaults without exposing layout calculations to document callers.

decisions:
  history-scope:
    current: Keep committed document history isolated by Board, include Board create, rename, and delete as lifecycle entries, and exclude transient canvas and workspace session state.
    affects:
      - "[[#/interface/operations/apply-change]]"
      - "[[#/interface/operations/undo]]"
      - "[[#/interface/operations/redo]]"
      - "[[#/interface/operations/create-board]]"
      - "[[#/interface/operations/rename-board]]"
      - "[[#/interface/operations/delete-board]]"
      - "[[#/interface/guarantees/provisional-history-neutral]]"
      - "[[#/interface/guarantees/history-isolated-per-board]]"
    reasons:
      - Undo must restore meaningful document states.
      - Transient previews and view changes must not pollute document history.
    consequences:
      - Committing a provisional batch creates history.
      - One accepted multi-item addition creates one history entry.
      - Cancelling a provisional batch creates no history.
      - Switching Boards cannot expose history entries from the previous Board.
      - Board lifecycle actions can be undone without turning view or window changes into document history.
    reconsider_when:
      - A transient interaction gains durable user meaning that users expect Undo to restore.
    explored_paths: {}
    sources:
      - label: Add document undo history
        url: https://github.com/noelcserepy/snappyref/pull/119

  history-durability:
    current: Apply, Undo, and Redo change memory first, queue ordered persistence that starts automatically, and preserve the resulting history across restart.
    affects:
      - "[[#/interface/operations/apply-change]]"
      - "[[#/interface/operations/undo]]"
      - "[[#/interface/operations/redo]]"
      - "[[#/interface/guarantees/persistence-off-interaction-path]]"
      - "[[#/interface/guarantees/history-survives-restart]]"
    reasons:
      - Undo and Redo are interactive document commands and must not wait on storage latency.
      - Restart must not erase the user's ability to reverse committed work.
    consequences:
      - History persistence preserves the semantic order of accepted changes.
      - Explicit lifecycle flush seams are completion barriers for already queued history and document writes and do not trigger persistence.
    reconsider_when:
      - Measured persistence cost or storage growth requires a bounded durable-history policy.
    explored_paths:
      memory-only-history:
        status: superseded
        reason: It loses committed undo and redo state at restart.
      synchronous-undo-persistence:
        status: rejected
        reason: It puts storage latency on an interactive command path.
    sources:
      - label: Add document undo history
        url: https://github.com/noelcserepy/snappyref/pull/119

  board-view-ownership:
    current: Persist viewport and background with each Board while keeping window, sidebar, Search, and global settings in Workspace Continuity.
    affects:
      - "[[#/purpose/owns]]"
      - "[[#/interface/operations/create-board]]"
      - "[[#/interface/operations/open-board]]"
      - "[[#/interface/operations/record-view]]"
    reasons:
      - Switching Boards must restore each Board's own spatial context.
      - Window and application-wide preferences are not Board document content.
    consequences:
      - Board switching restores target Board view state.
      - View changes remain outside Board undo history.
    reconsider_when: []
    explored_paths:
      workspace-wide-viewport:
        status: superseded
        reason: One shared viewport loses the spatial context of inactive Boards.
    sources: []
