schema: v0.1

purpose:
  outcome: Move an installed SnappyRef app to a verified newer release without changing Library, workspace, or separately managed model data.
  owns:
    - Signed release discovery.
    - App-package download progress and staging.
    - Package integrity and layout validation.
    - Platform-specific app replacement and recovery.
  excludes:
    - Library and Board migration policy.
    - Semantic Search model installation.
    - General release automation and changelog generation.
    - User-facing downgrade or rollback controls.

interface:
  operations:
    schedule-check:
      description: Decides when automatic or manual release discovery may start.

      input:
        state:
          type: UpdateCheckScheduleState
          description: Settled Idle state, last check time, consecutive failures, and any manual request.

      outcomes:
        check-now: {}
        wait:
          retry_after: Duration?
        wait-for-settled-idle: {}

      behavior:
        strict-first-idle: The first automatic check must wait until the app first reaches Settled Idle, without a startup-time fallback.
        six-hour-success-cadence: A successful automatic check schedules the next attempt no sooner than six hours later.
        bounded-failure-backoff: Consecutive automatic failures retry after exponential delays beginning at one minute and capped at six hours.
        manual-bypasses-cadence: A permitted manual request may produce check-now without waiting for Settled Idle or the automatic cadence.
        manual-throttled: Manual requests must be limited to one accepted request per minute.
        automatic-failure-quiet: Automatic discovery failure must remain in update status and must not interrupt the user with a modal.

      caller_obligations: {}

    check:
      description: Checks the signed release manifest for a newer compatible app release.

      input:
        installed:
          type: InstalledAppRelease
          description: The installed app version and platform package identity.

      outcomes:
        current: {}
        available:
          release: AppRelease
        invalid-manifest:
          reason: UpdateVerificationFailure
        unavailable:
          retry_after: Duration?

      behavior:
        signature-first: available must not expose an unverified manifest as actionable update state.
        newer-only: A release that is not newer than installed produces current.
        platform-match: available must identify a package compatible with the installed platform.
        prior-state-preserved: A failed check must not erase a previously verified actionable update.

      caller_obligations: {}

    prepare:
      description: Downloads and stages one verified app release.

      input:
        release:
          type: AppRelease
          description: A verified compatible release returned by check.

      outcomes:
        started:
          update: AppUpdate
        already-ready:
          staged: StagedAppRelease
        failed:
          reason: AppUpdateFailure
          release: AppRelease
        unavailable:
          retry_after: Duration?

      behavior:
        progress-measurable: started must expose download progress when package size is known.
        integrity-verified: Staging must verify the package hash before extracting or applying content.
        extraction-contained: Staging must reject path traversal, unexpected package roots, and unsupported platform layouts.
        incomplete-staging-private: A failed preparation must not expose incomplete staging as ready.
        failure-explicit: A download, verification, or staging failure produces failed for the requested release.
        retry-via-check: After failed, an explicit update action must perform a fresh signed check before it prepares the release again.
        repeat-safe: Repeating preparation for an already valid staged release produces already-ready.

      caller_obligations:
        verified-release: Supply an AppRelease returned by a successful check.
        user-authorized: Start download and staging only after an explicit user Update action.

    status:
      description: Reports the current app update state.

      input: {}

      outcomes:
        idle: {}
        available:
          release: AppRelease
        downloading:
          progress: UpdateProgress
        ready:
          staged: StagedAppRelease
        failed:
          reason: AppUpdateFailure

      behavior:
        actionable-state-stable: Transient check or download failures must not silently discard a still-valid staged release.

      caller_obligations: {}

    apply:
      description: Replaces the installed app with one staged verified release.

      input:
        staged:
          type: StagedAppRelease
          description: The verified platform package ready to apply.

      outcomes:
        applied:
          installed: InstalledAppRelease
        restart-required:
          relaunch: AppRelaunch
        recovered:
          installed: InstalledAppRelease
          reason: AppUpdateFailure
        recovery-required:
          backup: RecoverableAppRelease
          reason: AppUpdateFailure
        failed:
          reason: AppUpdateFailure

      behavior:
        staged-version-exact: applied must install the version identified by staged.
        user-data-untouched: Apply must not replace, delete, or package the Library, workspace session, or Local Model Store.
        partial-swap-restored: If promotion fails after the current app moves to its backup slot, the same updater invocation must attempt to restore the prior app.
        recoverability-explicit: If restoration also fails, apply must retain the backup and return recovery-required.
        no-post-launch-watchdog: applied and restart-required must not imply automatic monitoring or rollback after the new app launches.

      caller_obligations:
        allow-relaunch: Permit the platform updater to stop and relaunch SnappyRef when required.
        user-authorized: Apply only after an explicit user Restart action or continuation of the same user-started update flow.

  guarantees:
    verified-updates-only: SnappyRef must apply only a signed manifest and integrity-verified app package.
    actionable-release-coherent: The release reported as available, selected for preparation, and used for package verification must have the same verified identity. A later check reporting an older or installed release must not replace the package behind a retained available release.
    consistent-staged-layout-validation: Fresh preparation and recovery of staged updates after restart must enforce the same platform package layout, including the macOS updater helper. An incomplete staged package must not become ready to apply.
    app-package-only: App release packages must not contain the Library, workspace session, or Semantic Search Local Model Store.
    data-lifecycles-preserved: Update discovery, staging, apply, and recovery must preserve the Library, workspace session, and app-managed Local Model Store.
    downgrade-unsupported: App Update must not offer or apply a release older than the installed app.
    discovery-does-not-install: Automatic discovery may expose availability but must not download, stage, restart, or replace the app without user action.

  requires:
    install-root:
      target: "[[local-data-location#/interface/operations/resolve-install-root/outcomes/resolved]]"
      reason: Supplies the portable app location used for update download, staging, backup, and replacement.

decisions:
  app-package-boundary:
    current: Distribute app code and app-owned resources separately from the Library and Semantic Search Local Model Store.
    affects:
      - "[[#/interface/operations/prepare]]"
      - "[[#/interface/operations/apply]]"
      - "[[#/interface/guarantees/app-package-only]]"
    reasons:
      - The Library is user-owned content and the Local Model Store is app-managed replaceable data; both have lifecycles independent of the app package.
      - Semantic Search installation is optional and must not enlarge every app update.
    consequences:
      - App updates preserve Library and model data in place.
      - Semantic Search manages its own package installation and removal.
    reconsider_when:
      - A future platform requires one atomic package while still preserving independent user-data ownership.
    explored_paths:
      model-inside-app-package:
        status: rejected
        reason: It coupled optional model delivery to every app release.
      user-data-inside-app-package:
        status: rejected
        reason: Replacing app files could overwrite or remove user-owned content.
    sources:
      - label: Automatic in-app updates
        url: https://github.com/noelcserepy/snappyref/issues/77

  update-recovery-boundary:
    current: Attempt recovery during the updater's replacement invocation, but do not expose rollback controls or monitor the new app after launch.
    affects:
      - "[[#/purpose/excludes]]"
      - "[[#/interface/operations/apply]]"
    reasons:
      - A partial package swap must not silently strand a usable prior app in the backup slot.
      - User-controlled rollback and post-launch watchdog rollback are separate features.
    consequences:
      - The updater attempts immediate restoration when staged promotion fails.
      - A failed restoration returns the retained backup as recovery-required.
      - SnappyRef does not expose downgrade or rollback controls.
    reconsider_when:
      - SnappyRef adds a supported rollback workflow or post-launch health check.
    explored_paths:
      user-facing-rollback:
        status: superseded
        reason: Rollback controls were deferred from the current update workflow.
      post-launch-watchdog:
        status: rejected
        reason: The updater does not monitor and automatically revert a newly launched release.
    sources:
      - label: Simplify self-update UI and defer rollback
        url: https://github.com/noelcserepy/snappyref/pull/122
      - label: Apply staged app updates with a helper
        url: https://github.com/noelcserepy/snappyref/issues/83

  preparation-failure-retry:
    current: Record preparation failure for its release and retry only after a fresh signed release check.
    affects:
      - "[[#/interface/operations/check]]"
      - "[[#/interface/operations/prepare]]"
      - "[[#/interface/operations/status]]"
    reasons:
      - A fresh check prevents a stale failed release from starting a phantom download.
    consequences:
      - Failed preparation does not transition directly back to downloading.
      - A successful check can make the release available for another preparation attempt.
    reconsider_when:
      - Preparation retains enough verified release state to retry without another check.
    explored_paths: {}
    sources:
      - label: Download and stage verified app updates
        url: https://github.com/noelcserepy/snappyref/issues/82

  discovery-schedule:
    current: Wait strictly for first Settled Idle, then check every six hours after success, back off bounded failures, and let a one-minute-throttled manual action bypass the automatic schedule.
    affects:
      - "[[#/interface/operations/schedule-check]]"
      - "[[#/interface/operations/check]]"
      - "[[#/interface/guarantees/discovery-does-not-install]]"
    reasons:
      - Release discovery must not compete with startup and visible image preparation.
      - Failure should recover without network hammering or interrupting work.
      - Manual checking needs a responsive escape hatch with basic throttling.
    consequences:
      - An app that never reaches Settled Idle performs no automatic first check.
      - Automatic failure remains quiet and uses exponential backoff capped at the normal cadence.
      - Download, staging, and restart remain user-gated after discovery.
    reconsider_when:
      - Settled Idle can remain unreachable during otherwise usable long-running sessions.
    explored_paths:
      startup-time-fallback:
        status: rejected
        reason: It can start network work while startup queues are still active.
      automatic-download-and-apply:
        status: rejected
        reason: Discovery alone is not permission to download or restart.
    sources: []
