schema: v0.1

purpose:
  outcome: Turn external image sources or existing Assets into coherent Placement batches whose lifecycle matches how the user accepted them.
  owns:
    - Source intake for files, URLs, clipboard images, PureRef references, and existing Assets.
    - Initial Placement geometry planning.
    - Provisional preview and accepted-source lifecycle selection.
    - Correlation of asynchronous preparation results to Placements.
    - Commit and cancellation of Placement batches.
  excludes:
    - Image decoding and derivative generation.
    - Asset identity and managed storage.
    - Spatial layout algorithms.
    - Board persistence and document history implementation.

interface:
  operations:
    begin-provisional:
      description: Creates a movable, cancellable preview batch for content that the user has not accepted on the Board.

      input:
        request:
          type: ProvisionalPlacementRequest
          description: A non-empty source batch, target Board, target Board region, target area, and Placement Gap.

      outcomes:
        started:
          batch: ProvisionalPlacementBatch
        empty: {}
        rejected:
          reason: PlacementCreationRejection

      behavior:
        visible-immediately: started must return real provisional Placements before external content finishes preparing.
        one-active-batch: started must cancel any earlier provisional batch.
        known-size-used: Initial geometry must use known source or Asset dimensions when available.
        approximate-size-revisable: Missing dimensions may use approximate geometry that content resolution later corrects.

      caller_obligations:
        normalized-sources: Supply normalized source intent rather than raw platform events or transport payloads.

    create-committed:
      description: Creates committed Placements for source content that the user has already accepted on the Board.

      input:
        request:
          type: CommittedPlacementRequest
          description: A non-empty accepted source batch, target Board, target Board region, target area, and Placement Gap.

      outcomes:
        created:
          batch: CommittedPlacementBatch
          history_entry: DocumentHistoryEntry
        empty: {}
        rejected:
          reason: PlacementCreationRejection

      behavior:
        visible-immediately: created must return committed Loading or Loaded Placements before external content finishes preparing.
        accepted-source-only: File picker, URL, clipboard, PureRef, and accepted drop intake may use create-committed without a provisional preview.
        known-size-used: Initial geometry must use known source or Asset dimensions when available.
        approximate-size-revisable: Missing dimensions may use approximate geometry that content resolution later corrects.
        one-document-change: created must enter Board persistence and history as one document change.
        viewport-neutral: Accepted import, paste, URL, and drop intake must not pan, focus, zoom, or otherwise change the target Board viewport.

      caller_obligations:
        accepted-source: Call create-committed only after the source interaction has accepted Board content.
        normalized-sources: Supply normalized source intent rather than raw platform events or transport payloads.

    accept-resolution:
      description: Applies one preparation result to its provisional or committed Placement.

      input:
        creation:
          type: PlacementCreationId
          description: The provisional or committed creation that requested preparation.
        item:
          type: PlacementRef
          description: The provisional key or durable PlacementId whose content resolved.
        resolution:
          type: PreparedPlacementResolution
          description: Prepared content or a visible source failure.

      outcomes:
        updated:
          batch: PlacementBatch
        completed:
          batch: PlacementBatch
        ignored: {}
        creation-missing: {}

      behavior:
        correlated-in-place: updated and completed must modify the visible Placement identified by item.
        commit-remap-followed: A result that arrives after commit must follow the provisional-to-durable ID mapping.
        exact-asset-reused: Prepared content that matches an existing Asset must link to that canonical Asset.
        failure-retained: A failed resolution must leave a visible Failed Placement in the batch.
        stale-result-ignored: A result for a cancelled, replaced, or superseded request produces ignored.
        final-group-layout: completed must reconcile final dimensions before it applies the requested group layout.
        target-board-stable: Resolution must update the Board named by the creation even when another Board is active.
        inactive-layout-complete: Completion for an inactive target Board must apply the same final group layout offscreen that it would apply while active.

      caller_obligations: {}

    commit:
      description: Commits a provisional Placement batch to its Board in place.

      input:
        batch:
          type: ProvisionalBatchId
          description: The provisional batch to commit.

      outcomes:
        committed:
          placements: PlacementSet
          id_mapping: PlacementIdMapping
          history_entry: DocumentHistoryEntry
        already-finished: {}
        missing: {}
        rejected:
          reason: PlacementCreationRejection

      behavior:
        logical-identity-preserved: committed must preserve each visible Placement, its RectGeometry, and its content state while assigning durable PlacementIds.
        one-document-change: committed must enter Board persistence and history as one document change.
        repeat-safe: Repeating commit after success produces already-finished without another history entry.

      caller_obligations: {}

    cancel:
      description: Removes a provisional Placement batch without changing durable Board history.

      input:
        batch:
          type: ProvisionalBatchId
          description: The provisional batch to cancel.

      outcomes:
        cancelled:
          placements: PlacementSet
        already-finished: {}
        missing: {}

      behavior:
        history-neutral: cancelled must not create a Board history entry or durable Placement.
        pending-work-invalidated: Preparation results that arrive after cancellation must have no effect.
        repeat-safe: Repeating cancel after completion produces already-finished or missing without another change.

      caller_obligations: {}

  guarantees:
    explicit-group-paste: Clipboard intake must capture the explicit Grouping paste target at reservation and preserve that target through asynchronous creation; other source intake must not infer a Group target.
    real-placement-preview: Provisional content uses Placements, not a second preview or draft object.
    logical-placement-continuity: Content resolution and commit must preserve the visible Placement that the user has already manipulated.
    one-provisional-batch: At most one provisional Placement batch is active at a time.
    lifecycle-follows-acceptance: Preview and positioning interactions use provisional Placements, while already accepted source intake may create committed Placements directly.
    preparation-reservation-required: External-source preparation must receive the identity and planned position of an existing reserved Placement. Workers must resolve content without allocating a replacement Placement or independently choosing its initial position.
    shared-creation-capability: Every source uses the same geometry planning, Placement construction, and content-resolution correlation rules.
    shared-placement-gap: Initial group layout must use Spatial Layout's Placement Gap meaning.
    automatic-initial-sizing: New image intake and Search result placements must use the automatic target-area sizing policy without a workspace setting to disable it. Existing accepted geometry and internal copies must retain their own geometry rules.
    boundary-validation: Raw files, URLs, clipboard payloads, PureRef content, and platform drop data must become typed source intent before internal use.
    target-board-isolation: A creation remains bound to its target Board through preparation, commit, failure, and final layout.
    one-accepted-batch-history-entry: One accepted multi-item addition creates exactly one Board Document history entry.
    complete-resolution-ownership: Placement Creation must own result correlation, stale-result rejection, reservation completion, final batch layout, and submission of accepted content changes through Board Document. Callers must not coordinate these steps separately.
    diagnostics-independent: Disabling or omitting diagnostic reporting must not alter Placement resolution, accepted content, history, persistence, batch completion, or eligibility for semantic indexing.

  requires:
    grouping-target:
      target: "[[grouping#/interface]]"
      reason: Defines the explicit Group or member paste target and its insertion behavior.
    canonical-asset-registration:
      target: "[[local-library#/interface/operations/register-original/outcomes/registered]]"
      reason: Registers prepared originals and reuses exact canonical Assets.
    placement-lifecycle:
      target: "[[placement#/interface/operations/commit/outcomes/committed]]"
      reason: Defines logical Placement continuity and durable ID assignment during provisional commit.
    board-change:
      target: "[[board-document#/interface/operations/apply-change/outcomes/applied]]"
      reason: Commits a batch as one durable and undoable Board change.
    source-preparation:
      target: "[[image-preparation#/interface/operations/prepare-source/outcomes/prepared]]"
      reason: Converts external source intent into validated display and Library content.
    initial-layout:
      target: "[[spatial-layout#/interface/operations/arrange/outcomes/arranged]]"
      reason: Supplies deterministic group geometry and Placement Gap behavior.

decisions:
  provisional-batch-concurrency:
    current: Keep at most one provisional Placement batch active and cancel it when another batch starts.
    affects:
      - "[[#/interface/operations/begin-provisional]]"
      - "[[#/interface/operations/cancel]]"
      - "[[#/interface/guarantees/one-provisional-batch]]"
    reasons:
      - One active batch keeps acceptance, cancellation, selection, and late worker results unambiguous.
      - Reusing real Placements lets users manipulate the batch before content finishes.
    consequences:
      - Starting another preview or Search placement cancels the prior provisional batch.
      - Late results from the replaced batch have no effect.
    reconsider_when:
      - Users need to compare or manipulate multiple independent provisional batches at once.
    explored_paths:
      concurrent-provisional-batches:
        status: rejected
        reason: It introduced ambiguous commit, cancellation, selection, and result-correlation behavior.
    sources:
      - label: Deepen placement architecture and module ownership
        url: https://github.com/noelcserepy/snappyref/pull/128

  accepted-source-lifecycle:
    current: Use provisional Placements for unaccepted preview and positioning, and create committed Loading Placements immediately for accepted source intake.
    affects:
      - "[[#/interface/operations/begin-provisional]]"
      - "[[#/interface/operations/create-committed]]"
      - "[[#/interface/guarantees/lifecycle-follows-acceptance]]"
    reasons:
      - Hover and Search positioning need cancellation before Board acceptance.
      - File picker, paste, and accepted drop intake have already accepted Board content.
    consequences:
      - Accepted imports remain visible as committed Loading or Failed Placements while content resolves.
      - Both paths share geometry planning and resolution correlation.
    reconsider_when:
      - A source interaction cannot establish when the user accepted Board content.
    explored_paths:
      all-sources-provisional:
        status: rejected
        reason: It made already accepted imports wait for another lifecycle transition.
    sources:
      - label: Deepen placement architecture and module ownership
        url: https://github.com/noelcserepy/snappyref/pull/128

  target-board-continuity:
    current: Bind every creation to its target Board through asynchronous preparation and apply the same final group layout even when that Board is inactive.
    affects:
      - "[[#/interface/operations/begin-provisional]]"
      - "[[#/interface/operations/create-committed]]"
      - "[[#/interface/operations/accept-resolution]]"
      - "[[#/interface/guarantees/target-board-isolation]]"
    reasons:
      - Users can switch Boards before background preparation completes.
      - Active Canvas state must not decide which Board receives a late result.
      - Final layout should not depend on whether the target Board happens to be visible.
    consequences:
      - Inactive Board completion updates and compacts the target document offscreen.
      - Returning to the Board reveals the same final geometry as an always-active import.
    reconsider_when:
      - Placement preparation becomes synchronous with Board interaction.
    explored_paths:
      active-board-only-completion:
        status: rejected
        reason: It makes Board switching change the durable result of an accepted import.
    sources:
      - label: Deepen placement architecture and module ownership
        url: https://github.com/noelcserepy/snappyref/pull/128

  batch-history-unit:
    current: Record one accepted multi-item addition as exactly one Board Document history entry at acceptance or provisional commit.
    affects:
      - "[[#/interface/operations/create-committed]]"
      - "[[#/interface/operations/commit]]"
      - "[[#/interface/guarantees/one-accepted-batch-history-entry]]"
    reasons:
      - One accepted source batch is one user action even when preparation resolves item by item.
      - Undo must not expose asynchronous worker completion order.
    consequences:
      - Loading Placements enter history when the accepted batch appears.
      - Later load or failure resolution updates the same logical Placements without adding one entry per worker result.
    reconsider_when:
      - The UI lets users accept individual items independently within one batch.
    explored_paths:
      one-entry-per-resolution:
        status: rejected
        reason: It makes Undo depend on background completion order instead of user action.
    sources: []
