schema: v0.1

purpose:
  outcome: Represent every image-shaped object on a Board as one Placement throughout its visible lifetime.
  owns:
    - Placement identity.
    - RectGeometry.
    - Provisional and committed lifecycle state.
    - Loading, loaded, and failed content state.
    - The optional reference from a Placement to an Asset.
  excludes:
    - Asset ownership and storage.
    - Batch creation and import orchestration.
    - Board membership, selection, and history.

interface:
  operations:
    create:
      description: Creates a Placement in an explicit lifecycle and content state.

      input:
        definition:
          type: PlacementDefinition
          description: The RectGeometry, lifecycle, and initial content state for a new Placement.

      outcomes:
        created:
          placement: Placement
        rejected:
          reason: PlacementRejection

      behavior:
        lifecycle-reference-assigned: created must assign either a provisional Placement key or a durable PlacementId according to its lifecycle.
        explicit-state: created must contain one valid lifecycle state and one valid content state.
        geometry-owned: created must use a validated RectGeometry as the Placement display geometry.
        asset-optional-while-unresolved: Loading and Failed Placements may exist without an Asset.

      caller_obligations: {}

    resolve-content:
      description: Applies a completed content resolution to the same Placement.

      input:
        placement:
          type: PlacementRef
          description: The provisional key or durable PlacementId whose content resolution completed.
        resolution:
          type: PlacementContentResolution
          description: A loaded Asset and display content, or a visible failure.

      outcomes:
        resolved:
          placement: Placement
        unchanged:
          placement: Placement
        rejected:
          reason: PlacementRejection

      behavior:
        logical-identity-preserved: resolved must preserve the visible Placement identified by placement.
        loaded-links-asset: A successful resolution must produce Loaded content linked to an Asset.
        failure-visible: A failed resolution must produce Failed content on the same Placement.
        area-preserved: When intrinsic dimensions correct the aspect ratio, the Placement must preserve its displayed area.
        stale-resolution-ignored: A resolution for superseded content produces unchanged.

      caller_obligations: {}

    change-geometry:
      description: Applies a valid board-space geometry change to a Placement.

      input:
        placement:
          type: Placement
          description: The Placement to change.
        change:
          type: RectGeometryChange
          description: A semantic move, resize, scale, or rotation change.

      outcomes:
        changed:
          placement: Placement
        unchanged:
          placement: Placement
        rejected:
          reason: PlacementRejection

      behavior:
        board-space-authority: changed must update RectGeometry without changing Asset pixel metadata.
        identity-preserved: changed must preserve the PlacementRef and its Asset reference, including the absence of one.
        invalid-geometry-rejected: A non-finite center, size, scale, or rotation, or a non-positive width, height, or scale, produces rejected.

      caller_obligations: {}

    commit:
      description: Commits one provisional Placement while preserving its visible state.

      input:
        placement:
          type: Placement
          description: The provisional or already committed Placement.

      outcomes:
        committed:
          placement: Placement
          id_mapping: PlacementIdMapping
        already-committed:
          placement: Placement
        rejected:
          reason: PlacementRejection

      behavior:
        logical-identity-preserved: committed must preserve RectGeometry and content state.
        durable-id-assigned: committed may replace a provisional key with a durable PlacementId and must return that mapping.
        repeat-safe: Committing an already committed Placement produces already-committed without another change.

      caller_obligations: {}

  guarantees:
    one-canvas-image-type: Every visible image-shaped Board object is a Placement, including provisional, loading, and failed objects.
    geometry-separate-from-asset: Asset pixel dimensions must not replace Placement display geometry.
    lifecycle-aware-reference: A PlacementRef identifies either a provisional Placement key or a durable PlacementId without treating the two identities as interchangeable.
    state-exhaustive: Placement lifecycle and content use closed states rather than combinations of optional flags.

  requires:
    asset-resolution:
      target: "[[local-library#/interface/operations/resolve-asset/outcomes/available]]"
      reason: Defines the reusable image identity linked from Loaded content.

decisions:
  visible-image-object:
    current: Use Placement for every visible image-shaped Board object, including previews and failures.
    affects:
      - "[[#/purpose]]"
      - "[[#/interface/guarantees/one-canvas-image-type]]"
      - "[[#/interface/operations/resolve-content]]"
    reasons:
      - A separate preview object duplicated geometry, interaction, and commit rules.
      - Updating one Placement in place preserves identity throughout asynchronous work.
    consequences:
      - Provisional Placements support normal canvas interaction.
      - Content resolution and failure update the existing Placement.
    reconsider_when:
      - A visible image-shaped object cannot obey the Placement interface without exposing unrelated state.
    explored_paths:
      separate-preview-object:
        status: rejected
        reason: It forced callers to translate preview geometry and identity into a different committed object.
      placement-draft:
        status: rejected
        reason: It duplicated the Placement model without hiding a separate capability.
    sources:
      - label: Deepen placement architecture and module ownership
        url: https://github.com/noelcserepy/snappyref/pull/128

  geometry-authority:
    current: RectGeometry owns board-space display size, center, scale, and rotation. Asset dimensions remain source metadata, and Board Document owns stack order.
    affects:
      - "[[#/interface/operations/change-geometry]]"
      - "[[#/interface/operations/resolve-content/behavior/area-preserved]]"
      - "[[#/interface/guarantees/geometry-separate-from-asset]]"
    reasons:
      - The same Asset can appear at different sizes and rotations on different Boards.
      - Asynchronous metadata arrival must not reset user-chosen geometry.
    consequences:
      - Intrinsic aspect correction preserves displayed area.
      - Asset metadata changes do not redefine Placement geometry.
    reconsider_when: []
    explored_paths:
      asset-size-as-display-size:
        status: rejected
        reason: It coupled reusable source metadata to per-Board presentation.
    sources:
      - label: Deepen placement architecture and module ownership
        url: https://github.com/noelcserepy/snappyref/pull/128

  placement-identity-through-commit:
    current: Preserve the visible Placement through commit while replacing its provisional key with a durable PlacementId.
    affects:
      - "[[#/interface/operations/resolve-content]]"
      - "[[#/interface/operations/commit]]"
      - "[[#/interface/guarantees/lifecycle-aware-reference]]"
    reasons:
      - Durable Placement IDs come from Board persistence.
      - Users must not observe commit as deletion and recreation of the Placement they manipulated.
    consequences:
      - Commit returns a provisional-to-durable ID mapping.
      - Late content results must follow the mapping after commit.
    reconsider_when:
      - Board persistence can reserve durable PlacementIds before provisional interaction starts.
    explored_paths:
      stable-provisional-id:
        status: rejected
        reason: A provisional runtime ID cannot also serve as the durable persistence identity.
    sources:
      - label: Deepen placement architecture and module ownership
        url: https://github.com/noelcserepy/snappyref/pull/128

  geometry-validity:
    current: Reject non-finite RectGeometry values and non-positive width, height, or scale at external and persistence boundaries.
    affects:
      - "[[#/interface/operations/create]]"
      - "[[#/interface/operations/change-geometry]]"
    reasons:
      - Invalid geometry cannot produce a meaningful board-space rectangle.
      - Validation at construction prevents malformed values from reaching layout and rendering.
    consequences:
      - External creation and geometry-change requests reject invalid RectGeometry.
      - Persisted invalid geometry is rejected rather than admitted as trusted internal state.
      - Trusted internal transforms do not need to repeat boundary validation on every mutation.
    reconsider_when: []
    explored_paths: {}
    sources: []
