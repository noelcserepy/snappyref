schema: v0.1

purpose:
  outcome: Make Group and member edits reachable in one card at the canvas's right edge.
  owns:
    - Group and member card composition, field drafts, placement and presentation.
  excludes:
    - Group membership, selection and command admission.
    - Layout geometry and sizing conversions.
    - Durable document edits and history.

interface:
  operations:
    present:
      description: Presents contextual controls from Grouping state and accepts user field drafts or control actions.
      input:
        state:
          type: GroupingView
          description: Current dock identity, selection, Group values and control admission.
        viewport:
          type: CanvasViewport
          description: The available canvas rectangle.
        interaction:
          type: DockInteraction
          description: A field draft, submitted value, control activation or presentation update.
      outcomes:
        hidden: {}
        visible:
          view: GroupDockView
        submitted:
          action: GroupDockAction
        invalid-value:
          draft: DockFieldDraft
      behavior:
        provider-state: Presentation must derive mode, identity, count, ordinal and command availability from Grouping and sizing admission from Spatial Layout, without a second inspector or private copy of those rules.
        group-controls:
          statement: Group mode must show one card with a header of gold rule, name above its count, and a muted Ungroup text button with its shortcut tooltip; a LAYOUT section with icon-only Row, Column, Wrap and Free buttons with lowercase name tooltips, then the alignment pad beside the gap line and the Off, Between, Evenly and Around spread buttons; and a FRAME section with W and H sizes and their Hug chips on one line, then padding and a Clip switch.
          checks:
            - inspect::group-dock
        gap-line: Gap takes the whole line beside the pad, sharing it with row gap only in Wrap; its glyph points along the main axis, so it turns vertical in Column.
        alignment-pad:
          statement: With numeric gaps the pad must offer nine named alignment cells as dots, with the selected cell showing the cross-axis alignment glyph at 16 pixels. Every cell keeps a fixed grid rect, so the glyph never moves other dots. Under Between, Evenly or Around the same dots stay and the pad offers three cross-axis bands, rows in Row and Wrap and columns in Column; the selected band is one elevated pill with its glyph centered, and a band choice keeps the saved main-axis alignment.
          checks:
            - inspect::group-dock
        spread-glyphs: Spread buttons must draw three bars between two faint edge rules, placed like their distribution; Off draws the packed placement of the saved main-axis alignment, and glyphs turn vertical in Column.
        member-controls: Member mode must swap the card's contents in place for a header of gold rule, the Group name leading back to the Group card above "Member N of M", and a muted Detach text button; a FRAME section with Fill width and Fill height toggles on one line, then an Absolute switch. Member resizing stays on the canvas handles, and reordering on drag and the arrow keys.
        value-display: Counts must read "1 item" or "N items". Sizes must always show the outer size, dimmed while the axis hugs; submitting a changed size fixes the axis and a blur without a change must not. Dormant saved choices must remain visible when disabled, and Free must dim the pad, gap and spread.
        field-validation: Submitted names must trim to nonblank text, gaps and row gaps accept signed integers, padding accepts finite nonnegative values, and outer sizes accept finite positive values; invalid drafts must not become document edits or disable the field.
        scrub:
          statement: Dragging a number field's icon or W/H letter must change its value one unit per horizontal pixel, never below zero for spacing or one for sizes, showing a horizontal resize cursor and a "name · drag to change" tooltip. The Group follows every frame, and the whole drag becomes one undoable edit on release.
          checks:
            - inspect::group-dock
        draft-focus: Enter or blur must submit valid drafts and release text focus; Escape must discard an unsubmitted draft and release focus before dispatching further dismissal.
        placement:
          statement: The card must sit vertically centered 16 pixels inside the canvas's right edge, wherever the Group is, and scroll vertically when the canvas is shorter than the card plus 16 pixel margins. Member mode uses the same card and spot.
          checks:
            - inspect::group-dock
            - inspect::group-dock-narrow
            - inspect::member-dock
        local-dimensions: The card must be 264 pixels wide with 12 pixel padding, radius 14, 14 pixel section gaps and 8 pixel gaps inside a section; the pad is 70 pixels square beside a column of the 30 pixel gap line and 34 pixel spread bed; controls are 30 pixels high with radius 8, Hug chips 20 pixels high.
        visual-semantics: The card and dock must use existing warm theme surfaces, gold selected states, DM Sans, muted nondestructive Ungroup and Detach text, and distinguishable hover, focus and disabled states. Tooltips sit 8 pixels above their control on a tone lighter than the card.
        motion: The card must fade in with a small slide from the right on shared overlay timing, and switching between Group and member mode swaps its contents without motion; animation must not delay commands.
        canvas-feedback: Group selection must show a fine gold container outline and name; member editing must soften that outline and show a 2 pixel gold member outline, leaving the ordinal to the card, and drag feedback must mark the insertion slot.
      caller_obligations: {}
  guarantees: {}
  requires:
    grouping:
      target: "[[grouping#/interface]]"
      reason: Owns membership, dock identity, selection, text focus, dismissal order and grouping command admission.
    sizing:
      target: "[[spatial-layout#/interface]]"
      reason: Owns layout values and sizing admission used by dock controls.

decisions:
  group-card:
    current: Edit a selected Group in a card fixed center-right on the canvas, with alignment on an always-visible pad; member editing swaps the same card's contents.
    affects:
      - "[[#/interface/operations/present/behavior/group-controls]]"
      - "[[#/interface/operations/present/behavior/placement]]"
    reasons:
      - A fixed card never jumps while layout edits resize or move the Group, and the gold rule still ties it to the gold outline.
      - An always-visible pad shows alignment and spread together, without a popover to open and dismiss.
      - Sections keep layout and frame settings in a fixed reading order at any viewport width.
      - One card for both modes means member controls read like Group controls and never wrap across the canvas.
    consequences:
      - The card covers a Group that sits under the canvas's right edge until the user pans.
    reconsider_when:
      - Users routinely pan to uncover Groups behind the card.
    examples:
      - given: A 530 pixel Group in a 1280 by 800 pixel canvas.
        when: It is selected.
        then: The card's right edge sits at 1264 and its center at 400.
      - given: The Group grows from Wrap to a long Row.
        when: The card lays out.
        then: It stays where it was.
    explored_paths:
      anchored-beside:
        status: superseded
        reason: A card beside the Group jumped or covered it whenever a layout edit resized the Group.
      bottom-dock:
        status: superseded
        reason: Two settings rows far from the Group hid alignment behind a popover, and the member dock spread its controls across the canvas bottom.
      member-size-fields:
        status: rejected
        reason: Numeric member sizes duplicate the canvas corner handles.
      radial-handles:
        status: rejected
        reason: Press-and-fan menus were harder to parse for settings; they suit one-off actions or picking defaults.
      cycling-buttons:
        status: rejected
        reason: Values hidden behind repeated clicks were hard to predict.
    sources: []
