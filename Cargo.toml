[package]
name = "snappyref"
version = "0.3.2"
edition = "2024"
license = "MIT"
description = "Local-first reference board for collecting, arranging and searching image references"
repository = "https://github.com/noelcserepy/snappyref"
readme = "README.md"

[features]
default = ["turbojpeg-native"]
turbojpeg-native = ["dep:turbojpeg"]

[dependencies]
arboard = "3.6.1"
base64 = "0.22.1"
bytemuck = { version = "1.24.0", features = ["derive"] }
ed25519-dalek = { version = "2.1.1", default-features = false }
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["svg"] }
exr = "1.74.0"
getrandom = "0.3.4"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["default-formats"] }
jxl-oxide = { version = "0.12.5", features = ["image", "moxcms"] }
md-5 = "0.10.6"
png = "0.18.1"
ndarray = "0.17.2"
ort = "2.0.0-rc.12"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.39.0", features = ["bundled", "serialize"] }
semver = "1.0.23"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
zip = { version = "5.1.1", default-features = false, features = ["deflate"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
turbojpeg = { version = "1.4.0", optional = true, default-features = false, features = ["pkg-config"] }
url = "2.5.7"
usvg = { version = "0.45.1", default-features = false }

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["eframe", "wgpu"] }
pollster = "0.4.0"

[target.'cfg(target_os = "windows")'.dev-dependencies]
egui-winit = { version = "0.36.2", default-features = false }
winit = "0.30.13"

[profile.release-fast]
inherits = "release"
opt-level = 1
codegen-units = 256

[build-dependencies]
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["pem"] }
winresource = "0.1.31"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = ["NSResponder", "NSView", "NSWindow", "NSBitmapImageRep", "NSImageRep", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.2.2", features = ["NSDictionary", "NSData", "NSString", "NSURL"] }
rfd = { version = "0.17.2", default-features = false }
winit = "0.30.13"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6.2"
rfd = { version = "0.17.2", default-features = false }
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading", "Win32_UI_Shell"] }

[patch.crates-io]
eframe = { path = "vendor/eframe" }
egui-wgpu = { path = "vendor/egui-wgpu" }
egui-winit = { path = "vendor/egui-winit" }
