[package]
name = "reference"
version = "0.1.0"
edition = "2024"

[features]
default = ["semantic-search", "turbojpeg-native"]
semantic-search = ["dep:hf-hub", "dep:ndarray", "dep:ort", "dep:tokenizers"]
turbojpeg-native = ["dep:turbojpeg"]

[dependencies]
arboard = "3.6.1"
bytemuck = { version = "1.24.0", features = ["derive"] }
eframe = "0.34.1"
egui_extras = { version = "0.34.1", features = ["svg"] }
hf-hub = { version = "0.5.0", optional = true }
image = { version = "0.25.10", default-features = false, features = ["default-formats"] }
ndarray = { version = "0.17.2", optional = true }
ort = { version = "2.0.0-rc.12", optional = true }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokenizers = { version = "0.22.2", optional = true }
time = { version = "0.3.47", features = ["formatting"] }
turbojpeg = { version = "1.4.0", optional = true, default-features = false, features = ["pkg-config"] }
url = "2.5.7"

[dev-dependencies]
pollster = "0.4.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = ["NSResponder", "NSView", "NSWindow", "NSBitmapImageRep", "NSImageRep"] }
objc2-foundation = { version = "0.2.2", features = ["NSDictionary", "NSData", "NSString"] }
raw-window-handle = "0.6.2"

[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
