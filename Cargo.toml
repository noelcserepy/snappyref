[package]
name = "snappyref"
version = "0.1.5"
edition = "2024"

[features]
default = ["semantic-search", "turbojpeg-native"]
semantic-search = ["dep:hf-hub", "dep:ndarray", "dep:ort", "dep:tokenizers"]
turbojpeg-native = ["dep:turbojpeg"]

[dependencies]
arboard = "3.6.1"
bytemuck = { version = "1.24.0", features = ["derive"] }
ed25519-dalek = { version = "2.1.1", default-features = false }
eframe = "0.34.1"
egui_extras = { version = "0.34.1", features = ["svg"] }
exr = "1.74.0"
hex = "0.4.3"
hf-hub = { version = "0.5.0", optional = true }
image = { version = "0.25.10", default-features = false, features = ["default-formats"] }
jxl-oxide = { version = "0.12.5", features = ["image", "moxcms"] }
ndarray = { version = "0.17.2", optional = true }
ort = { version = "2.0.0-rc.12", optional = true }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
semver = "1.0.23"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
zip = { version = "5.1.1", default-features = false, features = ["deflate"] }
tokenizers = { version = "0.22.2", optional = true, default-features = false, features = ["onig"] }
time = { version = "0.3.47", features = ["formatting"] }
turbojpeg = { version = "1.4.0", optional = true, default-features = false, features = ["pkg-config"] }
url = "2.5.7"
usvg = { version = "0.45.1", default-features = false }

[dev-dependencies]
egui_kittest = "0.34.1"
pollster = "0.4.0"

[profile.release-fast]
inherits = "release"
opt-level = 1
codegen-units = 256

[build-dependencies]
winresource = "0.1.31"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = ["NSResponder", "NSView", "NSWindow", "NSBitmapImageRep", "NSImageRep", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.2.2", features = ["NSDictionary", "NSData", "NSString"] }
raw-window-handle = "0.6.2"
winit = "0.30.13"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Shell"] }

[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
