name: Install libjpeg-turbo on Windows
description: Build static libjpeg-turbo with vcpkg and point the turbojpeg crate at it.
runs:
  using: composite
  steps:
    - shell: pwsh
      run: |
        $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
        $vcpkgTriplet = "x64-windows-static-md"
        # Pinned to libjpeg-turbo 3.1.4.1. Later ports link PNG support against
        # separate libspng and zlib libraries that turbojpeg-sys does not link.
        $vcpkgCommit = "81b02e92500190bbcce345a06aa86f396074e20e"
        git init --quiet $vcpkgRoot
        git -C $vcpkgRoot fetch --quiet --depth 1 https://github.com/microsoft/vcpkg.git $vcpkgCommit
        git -C $vcpkgRoot checkout --quiet FETCH_HEAD
        & "$vcpkgRoot\bootstrap-vcpkg.bat"
        & "$vcpkgRoot\vcpkg.exe" install "libjpeg-turbo:$vcpkgTriplet"
        "TURBOJPEG_SOURCE=explicit" | Out-File -FilePath $env:GITHUB_ENV -Append
        "TURBOJPEG_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append
        "TURBOJPEG_LIB_DIR=$vcpkgRoot\installed\$vcpkgTriplet\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
        "TURBOJPEG_INCLUDE_DIR=$vcpkgRoot\installed\$vcpkgTriplet\include" | Out-File -FilePath $env:GITHUB_ENV -Append
