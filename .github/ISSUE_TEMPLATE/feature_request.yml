name: Feature request
description: Something SnappyRef should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and where the app gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would change. Shortcuts, defaults, or a rough sketch of the interaction all help.
    validations:
      required: true
