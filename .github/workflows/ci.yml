name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pull requests wait for the macOS job only, about 2-3 minutes. A ruleset on
# main requires that job name, so rename it only together with the ruleset.
# The Windows job takes about 10 minutes. It runs after the merge and on manual
# dispatch, and opens an issue when it fails on main.
jobs:
  macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install native test dependencies
        run: brew install jpeg-turbo openssl@3

      - name: Configure turbojpeg
        run: |
          echo "TURBOJPEG_SOURCE=explicit" >> "$GITHUB_ENV"
          echo "TURBOJPEG_STATIC=1" >> "$GITHUB_ENV"
          echo "TURBOJPEG_LIB_DIR=$(brew --prefix jpeg-turbo)/lib" >> "$GITHUB_ENV"
          echo "TURBOJPEG_INCLUDE_DIR=$(brew --prefix jpeg-turbo)/include" >> "$GITHUB_ENV"

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: script tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          bash tests/scripts/test-build-signed-manifest.sh

  windows:
    name: Windows
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install libjpeg-turbo
        uses: ./.github/actions/install-turbojpeg-windows

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: Windows source synchronization tests
        shell: pwsh
        run: ./scripts/test_windows_sync.ps1

      - name: Report a failure on main
        if: failure() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/report-windows-ci-failure.sh
