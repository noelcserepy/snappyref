name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    if: ${{ false }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Check
        run: cargo check --locked --no-default-features --features semantic-search
