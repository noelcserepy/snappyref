name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A run on main is the only CI a merge gets, so let it finish. A newer merge
  # still replaces one that is waiting.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# CI runs after each merge to main and on manual dispatch, never on pull
# requests. The pre-push hook runs the same checks before each push, and the
# Bugs reviewer runs them again in a fresh checkout. Each job opens an issue
# when it fails on main. The macOS job still finds what only a slower runner
# shows, such as a timing-dependent test.
jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install native test dependencies
        run: brew install jpeg-turbo openssl@3

      - name: Configure turbojpeg
        run: |
          echo "TURBOJPEG_SOURCE=explicit" >> "$GITHUB_ENV"
          echo "TURBOJPEG_STATIC=1" >> "$GITHUB_ENV"
          echo "TURBOJPEG_LIB_DIR=$(brew --prefix jpeg-turbo)/lib" >> "$GITHUB_ENV"
          echo "TURBOJPEG_INCLUDE_DIR=$(brew --prefix jpeg-turbo)/include" >> "$GITHUB_ENV"

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: script tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          bash tests/scripts/test-build-signed-manifest.sh

      - name: Report a failure on main
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/report-ci-failure.sh macOS

  windows:
    name: Windows
    runs-on: windows-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install libjpeg-turbo
        uses: ./.github/actions/install-turbojpeg-windows

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: Windows source synchronization tests
        shell: pwsh
        run: ./scripts/test_windows_sync.ps1

      - name: Report a failure on main
        if: failure() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/report-ci-failure.sh Windows
