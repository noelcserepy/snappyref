name: Build macOS App

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: main
        type: string
      build_profile:
        description: Build profile
        required: false
        default: release-fast
        type: choice
        options:
          - release-fast
          - release
      semantic_search_url:
        description: Compiled Semantic Search asset URL
        required: false
        default: ""
        type: string
      semantic_search_sha256:
        description: Compiled Semantic Search asset sha256
        required: false
        default: ""
        type: string
      semantic_search_size:
        description: Compiled Semantic Search asset byte size
        required: false
        default: ""
        type: string
      handoff_release_tag:
        description: Source-repo draft release tag for reusable app build handoff
        required: false
        default: v0.2.0
        type: string
  workflow_call:
    inputs:
      ref:
        required: false
        default: main
        type: string
      build_profile:
        required: false
        default: release
        type: string
      semantic_search_url:
        required: false
        default: ""
        type: string
      semantic_search_sha256:
        required: false
        default: ""
        type: string
      semantic_search_size:
        required: false
        default: ""
        type: string
      handoff_release_tag:
        required: false
        default: v0.2.0
        type: string

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS app
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos-${{ inputs.build_profile }}
          add-job-id-key: false
          cache-bin: false
          save-if: true

      - name: Install libjpeg-turbo
        if: ${{ inputs.build_profile == 'release' }}
        run: brew install jpeg-turbo

      - name: Configure turbojpeg
        if: ${{ inputs.build_profile == 'release' }}
        run: |
          echo "TURBOJPEG_SOURCE=explicit" >> "$GITHUB_ENV"
          echo "TURBOJPEG_STATIC=1" >> "$GITHUB_ENV"
          echo "TURBOJPEG_LIB_DIR=$(brew --prefix jpeg-turbo)/lib" >> "$GITHUB_ENV"
          echo "TURBOJPEG_INCLUDE_DIR=$(brew --prefix jpeg-turbo)/include" >> "$GITHUB_ENV"

      - name: Resolve Semantic Search descriptor
        shell: bash
        env:
          SNAPPYREF_SEMANTIC_SEARCH_URL: ${{ inputs.semantic_search_url }}
          SNAPPYREF_SEMANTIC_SEARCH_SHA256: ${{ inputs.semantic_search_sha256 }}
          SNAPPYREF_SEMANTIC_SEARCH_SIZE: ${{ inputs.semantic_search_size }}
        run: |
          python scripts/semantic-search-descriptor.py resolve \
            --output "$RUNNER_TEMP/semantic-search-descriptor/semantic-search-descriptor.env" \
            --github-env "$GITHUB_ENV"

      - name: Build app binary
        run: |
          if [[ "${{ inputs.build_profile }}" == "release" ]]; then
            cargo build --release --locked --bins
            echo "SNAPPYREF_TARGET_DIR=target/release" >> "$GITHUB_ENV"
          else
            cargo build --profile release-fast --locked --no-default-features --bins
            echo "SNAPPYREF_TARGET_DIR=target/release-fast" >> "$GITHUB_ENV"
          fi

      - name: Verify turbojpeg is statically linked
        if: ${{ inputs.build_profile == 'release' }}
        run: |
          if otool -L "$SNAPPYREF_TARGET_DIR/snappyref" | tail -n +2 | grep -i turbojpeg; then
            echo "snappyref has a dynamic libturbojpeg dependency" >&2
            exit 1
          fi

      - name: Package app artifact
        run: |
          if [[ "$SNAPPYREF_TARGET_DIR" != "target/release" ]]; then
            mkdir -p target/release
            cp "$SNAPPYREF_TARGET_DIR/snappyref" target/release/snappyref
            cp "$SNAPPYREF_TARGET_DIR/snappyref-updater" target/release/snappyref-updater
          fi
          zip_path="${RUNNER_TEMP}/snappyref-macos-app.zip"
          scripts/package-macos-artifact.sh "$zip_path"
          cp "${RUNNER_TEMP}/semantic-search-descriptor/semantic-search-descriptor.env" \
            "${RUNNER_TEMP}/snappyref-macos-semantic-search-descriptor.env"

      - name: Upload app handoff release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.handoff_release_tag }}"
          if [[ -z "$tag" ]]; then
            echo "handoff_release_tag is required" >&2
            exit 1
          fi

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "${{ inputs.ref }}" \
              --title "SnappyRef $tag" \
              --notes "Draft SnappyRef release." \
              --draft \
              || gh release view "$tag" >/dev/null
          fi

          gh release upload "$tag" \
            "${RUNNER_TEMP}/snappyref-macos-app.zip" \
            "${RUNNER_TEMP}/snappyref-macos-semantic-search-descriptor.env" \
            --clobber
