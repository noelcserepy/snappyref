name: Build macOS App

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: main
        type: string
      build_profile:
        description: Build profile
        required: false
        default: release-fast
        type: choice
        options:
          - release-fast
          - release
      semantic_search_url:
        description: Compiled Semantic Search asset URL
        required: false
        default: https://github.com/noelcserepy/snappyref-dist/releases/download/semantic-search/snappyref-semantic-search.zip
        type: string
      semantic_search_sha256:
        description: Compiled Semantic Search asset sha256
        required: true
        type: string
      semantic_search_size:
        description: Compiled Semantic Search asset byte size
        required: true
        type: string
      upload_actions_artifacts:
        description: Upload app and descriptor through GitHub Actions artifacts
        required: false
        default: true
        type: boolean
      handoff_release_tag:
        description: Source-repo release tag used when Actions artifact handoff is disabled
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      ref:
        required: false
        default: main
        type: string
      build_profile:
        required: false
        default: release
        type: string
      semantic_search_url:
        required: false
        default: https://github.com/noelcserepy/snappyref-dist/releases/download/semantic-search/snappyref-semantic-search.zip
        type: string
      semantic_search_sha256:
        required: true
        type: string
      semantic_search_size:
        required: true
        type: string
      upload_actions_artifacts:
        required: false
        default: true
        type: boolean
      handoff_release_tag:
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS app
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos-${{ inputs.build_profile }}
          add-job-id-key: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install libjpeg-turbo
        if: ${{ inputs.build_profile == 'release' }}
        run: brew install jpeg-turbo

      - name: Configure turbojpeg
        if: ${{ inputs.build_profile == 'release' }}
        run: |
          echo "TURBOJPEG_SOURCE=explicit" >> "$GITHUB_ENV"
          echo "TURBOJPEG_STATIC=1" >> "$GITHUB_ENV"
          echo "TURBOJPEG_LIB_DIR=$(brew --prefix jpeg-turbo)/lib" >> "$GITHUB_ENV"
          echo "TURBOJPEG_INCLUDE_DIR=$(brew --prefix jpeg-turbo)/include" >> "$GITHUB_ENV"

      - name: Build app binary
        run: |
          if [[ -z "${{ inputs.semantic_search_sha256 }}" || -z "${{ inputs.semantic_search_size }}" ]]; then
            echo "Semantic Search descriptor inputs are required for release app builds." >&2
            exit 1
          fi
          export SNAPPYREF_SEMANTIC_SEARCH_URL="${{ inputs.semantic_search_url }}"
          export SNAPPYREF_SEMANTIC_SEARCH_SHA256="${{ inputs.semantic_search_sha256 }}"
          export SNAPPYREF_SEMANTIC_SEARCH_SIZE="${{ inputs.semantic_search_size }}"
          if [[ "${{ inputs.build_profile }}" == "release" ]]; then
            cargo build --release --locked --bins
            echo "SNAPPYREF_TARGET_DIR=target/release" >> "$GITHUB_ENV"
          else
            cargo build --profile release-fast --locked --no-default-features --features semantic-search --bins
            echo "SNAPPYREF_TARGET_DIR=target/release-fast" >> "$GITHUB_ENV"
          fi

      - name: Write Semantic Search descriptor artifact
        run: |
          descriptor_dir="${RUNNER_TEMP}/semantic-search-descriptor"
          mkdir -p "$descriptor_dir"
          {
            echo "semantic_search_url=${{ inputs.semantic_search_url }}"
            echo "semantic_search_sha256=${{ inputs.semantic_search_sha256 }}"
            echo "semantic_search_size=${{ inputs.semantic_search_size }}"
          } > "$descriptor_dir/semantic-search-descriptor.env"

      - name: Verify turbojpeg is statically linked
        if: ${{ inputs.build_profile == 'release' }}
        run: |
          if otool -L "$SNAPPYREF_TARGET_DIR/snappyref" | tail -n +2 | grep -i turbojpeg; then
            echo "snappyref has a dynamic libturbojpeg dependency" >&2
            exit 1
          fi

      - name: Package app artifact
        run: |
          if [[ "$SNAPPYREF_TARGET_DIR" != "target/release" ]]; then
            mkdir -p target/release
            cp "$SNAPPYREF_TARGET_DIR/snappyref" target/release/snappyref
            cp "$SNAPPYREF_TARGET_DIR/snappyref-updater" target/release/snappyref-updater
          fi
          zip_path="${RUNNER_TEMP}/snappyref-macos-app.zip"
          scripts/package-macos-artifact.sh "$zip_path"
          cp "${RUNNER_TEMP}/semantic-search-descriptor/semantic-search-descriptor.env" \
            "${RUNNER_TEMP}/snappyref-macos-semantic-search-descriptor.env"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.upload_actions_artifacts }}
        with:
          name: snappyref-macos-app
          path: ${{ runner.temp }}/snappyref-macos-app.zip
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.upload_actions_artifacts }}
        with:
          name: snappyref-macos-semantic-search-descriptor
          path: ${{ runner.temp }}/semantic-search-descriptor/semantic-search-descriptor.env
          retention-days: 7

      - name: Upload app handoff release assets
        if: ${{ !inputs.upload_actions_artifacts }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.handoff_release_tag }}"
          if [[ -z "$tag" ]]; then
            echo "handoff_release_tag is required when upload_actions_artifacts=false" >&2
            exit 1
          fi

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "${{ inputs.ref }}" \
              --title "SnappyRef $tag" \
              --notes "Draft SnappyRef release." \
              --draft \
              || gh release view "$tag" >/dev/null
          fi

          gh release upload "$tag" \
            "${RUNNER_TEMP}/snappyref-macos-app.zip" \
            "${RUNNER_TEMP}/snappyref-macos-semantic-search-descriptor.env" \
            --clobber
