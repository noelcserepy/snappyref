name: Build Apps

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: main
        type: string
      artifact_profile:
        description: Build profile for app artifacts
        required: false
        default: release-fast
        type: choice
        options:
          - release-fast
          - release

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows app
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install libjpeg-turbo
        if: ${{ inputs.artifact_profile == 'release' }}
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          $vcpkgTriplet = "x64-windows-static-md"
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          & "$vcpkgRoot\bootstrap-vcpkg.bat"
          & "$vcpkgRoot\vcpkg.exe" install "libjpeg-turbo:$vcpkgTriplet"
          "TURBOJPEG_SOURCE=explicit" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TURBOJPEG_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TURBOJPEG_LIB_DIR=$vcpkgRoot\installed\$vcpkgTriplet\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TURBOJPEG_INCLUDE_DIR=$vcpkgRoot\installed\$vcpkgTriplet\include" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build app binary
        shell: pwsh
        run: |
          if ("${{ inputs.artifact_profile }}" -eq "release") {
            cargo build --release --locked
            "SNAPPYREF_TARGET_DIR=target\release" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            cargo build --profile release-fast --locked --no-default-features --features semantic-search
            "SNAPPYREF_TARGET_DIR=target\release-fast" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Verify Windows GUI subsystem
        shell: pwsh
        run: |
          $exe = Join-Path $env:SNAPPYREF_TARGET_DIR "snappyref.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          if ($subsystem -ne 2) {
            throw "expected Windows GUI subsystem 2, got $subsystem"
          }

      - name: Package app artifact
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP "snappyref-windows-app\SnappyRef"
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item (Join-Path $env:SNAPPYREF_TARGET_DIR "snappyref.exe") $packageRoot
          Copy-Item UPDATE.txt $packageRoot

      - uses: actions/upload-artifact@v4
        with:
          name: snappyref-windows-app-${{ github.sha }}
          path: ${{ runner.temp }}/snappyref-windows-app
          retention-days: 7

  macos:
    name: Build macOS app
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install libjpeg-turbo
        if: ${{ inputs.artifact_profile == 'release' }}
        run: brew install jpeg-turbo

      - name: Configure turbojpeg
        if: ${{ inputs.artifact_profile == 'release' }}
        run: |
          echo "TURBOJPEG_SOURCE=explicit" >> "$GITHUB_ENV"
          echo "TURBOJPEG_STATIC=1" >> "$GITHUB_ENV"
          echo "TURBOJPEG_LIB_DIR=$(brew --prefix jpeg-turbo)/lib" >> "$GITHUB_ENV"
          echo "TURBOJPEG_INCLUDE_DIR=$(brew --prefix jpeg-turbo)/include" >> "$GITHUB_ENV"

      - name: Build app binary
        run: |
          if [[ "${{ inputs.artifact_profile }}" == "release" ]]; then
            cargo build --release --locked
            echo "SNAPPYREF_TARGET_DIR=target/release" >> "$GITHUB_ENV"
          else
            cargo build --profile release-fast --locked --no-default-features --features semantic-search
            echo "SNAPPYREF_TARGET_DIR=target/release-fast" >> "$GITHUB_ENV"
          fi

      - name: Verify turbojpeg is statically linked
        if: ${{ inputs.artifact_profile == 'release' }}
        run: |
          if otool -L "$SNAPPYREF_TARGET_DIR/snappyref" | tail -n +2 | grep -i turbojpeg; then
            echo "snappyref has a dynamic libturbojpeg dependency" >&2
            exit 1
          fi

      - name: Package app artifact
        run: |
          mkdir -p target/release
          cp "$SNAPPYREF_TARGET_DIR/snappyref" target/release/snappyref
          zip_path="${RUNNER_TEMP}/snappyref-macos-app-${{ github.sha }}.zip"
          scripts/package-macos-artifact.sh --skip-models "$zip_path"

      - uses: actions/upload-artifact@v4
        with:
          name: snappyref-macos-app-${{ github.sha }}
          path: ${{ runner.temp }}/snappyref-macos-app-${{ github.sha }}.zip
          retention-days: 7
