name: Release Artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows artifact
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install libjpeg-turbo
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          & "$vcpkgRoot\bootstrap-vcpkg.bat"
          & "$vcpkgRoot\vcpkg.exe" install libjpeg-turbo:x64-windows-static
          "TURBOJPEG_SOURCE=explicit" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TURBOJPEG_LIB_DIR=$vcpkgRoot\installed\x64-windows-static\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TURBOJPEG_INCLUDE_DIR=$vcpkgRoot\installed\x64-windows-static\include" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package artifact
        shell: pwsh
        run: |
          $zipPath = Join-Path $env:RUNNER_TEMP "reference-windows-${{ github.ref_name }}.zip"
          Compress-Archive -Path target\release\reference.exe -DestinationPath $zipPath -Force

      - uses: actions/upload-artifact@v4
        with:
          name: reference-windows-${{ github.ref_name }}
          path: ${{ runner.temp }}/reference-windows-${{ github.ref_name }}.zip
          retention-days: 7

  macos:
    name: Build macOS artifact
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install libjpeg-turbo
        run: brew install jpeg-turbo

      - name: Configure turbojpeg
        run: |
          echo "TURBOJPEG_SOURCE=explicit" >> "$GITHUB_ENV"
          echo "TURBOJPEG_LIB_DIR=$(brew --prefix jpeg-turbo)/lib" >> "$GITHUB_ENV"
          echo "TURBOJPEG_INCLUDE_DIR=$(brew --prefix jpeg-turbo)/include" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package artifact
        run: |
          zip_path="${RUNNER_TEMP}/reference-macos-${{ github.ref_name }}.zip"
          (cd target/release && zip -9 "$zip_path" reference)

      - uses: actions/upload-artifact@v4
        with:
          name: reference-macos-${{ github.ref_name }}
          path: ${{ runner.temp }}/reference-macos-${{ github.ref_name }}.zip
          retention-days: 7

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - windows
      - macos

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/artifacts/**/*.zip
