name: Publish Full Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag, for example v0.1.0
        required: true
        default: v0.1.0
        type: string
      notes_url:
        description: Public URL the auto-updater shows for these release notes
        required: true
        default: https://github.com/noelcserepy/snappyref-dist/releases
        type: string
      ref:
        description: Git ref to build
        required: false
        default: main
        type: string
      build_profile:
        description: Build profile
        required: false
        default: release
        type: choice
        options:
          - release
          - release-fast
      include_windows:
        description: Build and package Windows
        required: false
        default: true
        type: boolean
      include_macos:
        description: Build and package macOS
        required: false
        default: true
        type: boolean
      create_draft_release:
        description: Attach final zips to the source-repo draft GitHub Release
        required: false
        default: true
        type: boolean
      publish_to_dist:
        description: Create draft release on snappyref-dist with signed latest.json
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  contents: write

env:
  DIST_REPO: noelcserepy/snappyref-dist

jobs:
  windows:
    name: Build Windows app
    if: ${{ inputs.include_windows }}
    uses: ./.github/workflows/build-windows-app.yml
    with:
      ref: ${{ inputs.ref }}
      build_profile: ${{ inputs.build_profile }}

  macos:
    name: Build macOS app
    if: ${{ inputs.include_macos }}
    uses: ./.github/workflows/build-macos-app.yml
    with:
      ref: ${{ inputs.ref }}
      build_profile: ${{ inputs.build_profile }}

  prune-release-caches:
    name: Prune release caches
    runs-on: ubuntu-latest
    needs:
      - windows
      - macos
    if: ${{ always() && (inputs.include_windows || inputs.include_macos) }}
    permissions:
      actions: write
      contents: read

    steps:
      - name: Keep latest release cache per platform
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_PROFILE: ${{ inputs.build_profile }}
        run: |
          set -euo pipefail

          prune_cache_family() {
            local family="$1"
            mapfile -t stale_ids < <(
              gh cache list \
                --repo "$GITHUB_REPOSITORY" \
                --limit 100 \
                --json id,key,lastAccessedAt \
                --jq "sort_by(.lastAccessedAt) | reverse | map(select(.key | contains(\"${family}\"))) | .[1:] | .[].id"
            )

            for cache_id in "${stale_ids[@]}"; do
              gh cache delete "$cache_id" --repo "$GITHUB_REPOSITORY"
            done
          }

          if [[ "${{ inputs.include_macos }}" == "true" ]]; then
            prune_cache_family "release-macos-${BUILD_PROFILE}"
          fi

          if [[ "${{ inputs.include_windows }}" == "true" ]]; then
            prune_cache_family "release-windows-${BUILD_PROFILE}"
          fi

  package:
    name: Package release zips
    runs-on: ubuntu-latest
    needs:
      - windows
      - macos
    if: ${{ always() && (!inputs.include_windows || needs.windows.result == 'success') && (!inputs.include_macos || needs.macos.result == 'success') }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/download-artifact@v4
        if: ${{ inputs.include_windows }}
        with:
          name: snappyref-windows-app
          path: ${{ runner.temp }}/app-artifacts/windows

      - uses: actions/download-artifact@v4
        if: ${{ inputs.include_macos }}
        with:
          name: snappyref-macos-app
          path: ${{ runner.temp }}/app-artifacts/macos

      - name: Package app zips
        id: package
        run: |
          set -euo pipefail
          release_assets="${RUNNER_TEMP}/release-assets"
          mkdir -p "$release_assets"

          tag="${{ inputs.release_tag }}"

          if [[ "${{ inputs.include_windows }}" == "true" ]]; then
            windows_app="${RUNNER_TEMP}/windows-app.zip"
            (cd "${RUNNER_TEMP}/app-artifacts/windows" && zip -9 -r "$windows_app" SnappyRef)

            scripts/package-release-assets.sh \
              --platform windows \
              --app-archive "$windows_app" \
              --output "$release_assets/snappyref-windows-${tag}.zip"
          fi

          if [[ "${{ inputs.include_macos }}" == "true" ]]; then
            macos_app_zip=$(find "${RUNNER_TEMP}/app-artifacts/macos" -type f -name 'snappyref-macos-app.zip' | head -n 1)
            if [[ -z "$macos_app_zip" ]]; then
              echo "missing macOS app artifact" >&2
              exit 1
            fi

            scripts/package-release-assets.sh \
              --platform macos \
              --app-archive "$macos_app_zip" \
              --output "$release_assets/snappyref-mac-${tag}.zip"
          fi

          # Derive a deterministic version (strip leading "v") and timestamp
          # for the auto-update manifest.
          version="${tag#v}"
          released_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "released_at=$released_at" >> "$GITHUB_OUTPUT"

      - name: Write signing private key
        if: ${{ inputs.publish_to_dist }}
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${MANIFEST_SIGNING_KEY:-}" ]]; then
            echo "MANIFEST_SIGNING_KEY secret is not configured" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/signing"
          chmod 700 "${RUNNER_TEMP}/signing"
          printf '%s\n' "$MANIFEST_SIGNING_KEY" > "${RUNNER_TEMP}/signing/private.pem"
          chmod 600 "${RUNNER_TEMP}/signing/private.pem"

      - name: Build and sign latest.json
        if: ${{ inputs.publish_to_dist && inputs.include_macos && inputs.include_windows }}
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag }}"
          version="${{ steps.package.outputs.version }}"
          released_at="${{ steps.package.outputs.released_at }}"

          base_url="https://github.com/${DIST_REPO}/releases/download/${tag}"
          macos_url="${base_url}/snappyref-mac-${tag}.zip"
          windows_url="${base_url}/snappyref-windows-${tag}.zip"

          scripts/build-signed-manifest.sh \
            --version "$version" \
            --released-at "$released_at" \
            --notes-url "${{ inputs.notes_url }}" \
            --macos-zip "${RUNNER_TEMP}/release-assets/snappyref-mac-${tag}.zip" \
            --macos-url "$macos_url" \
            --windows-zip "${RUNNER_TEMP}/release-assets/snappyref-windows-${tag}.zip" \
            --windows-url "$windows_url" \
            --private-key "${RUNNER_TEMP}/signing/private.pem" \
            --public-key docs/keys/signing-key.pub.pem \
            --output "${RUNNER_TEMP}/release-assets/latest.json"

      - name: Clean up signing key material
        if: ${{ always() && inputs.publish_to_dist }}
        run: |
          rm -rf "${RUNNER_TEMP}/signing"

      - uses: actions/upload-artifact@v4
        with:
          name: snappyref-release-zips
          path: |
            ${{ runner.temp }}/release-assets/*.zip
            ${{ runner.temp }}/release-assets/latest.json
          retention-days: 7

      - name: Create source-repo draft release
        if: ${{ inputs.create_draft_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "${{ inputs.ref }}" \
              --title "SnappyRef $tag" \
              --notes "Draft SnappyRef release." \
              --draft
          fi
          gh release upload "$tag" "${RUNNER_TEMP}"/release-assets/*.zip --clobber

      - name: Publish to snappyref-dist
        if: ${{ inputs.publish_to_dist && inputs.include_macos && inputs.include_windows }}
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag }}"

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "DIST_REPO_TOKEN secret is not configured" >&2
            exit 1
          fi

          if ! gh release view "$tag" --repo "$DIST_REPO" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$DIST_REPO" \
              --title "SnappyRef $tag" \
              --notes "SnappyRef $tag. See https://github.com/noelcserepy/snappyref-dist for details." \
              --draft
          fi

          # Both app zips and the signed manifest are required for an
          # auto-update-eligible release. Semantic Search assets live on the
          # dedicated semantic-search release.
          gh release upload "$tag" \
            --repo "$DIST_REPO" \
            "${RUNNER_TEMP}/release-assets/snappyref-mac-${tag}.zip" \
            "${RUNNER_TEMP}/release-assets/snappyref-windows-${tag}.zip" \
            "${RUNNER_TEMP}/release-assets/latest.json" \
            --clobber
