name: Publish Full Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag, blank uses the selected source version
        required: false
        default: ""
        type: string
      notes_url:
        description: Release notes URL included in the signed update manifest
        required: true
        default: https://github.com/noelcserepy/snappyref/releases
        type: string
      ref:
        description: Git ref to build
        required: false
        default: main
        type: string
      include_windows:
        description: Build and package Windows
        required: false
        default: true
        type: boolean
      include_macos:
        description: Build and package macOS
        required: false
        default: true
        type: boolean
      publish_update:
        description: Sign latest.json. Off for a dry run that only attaches zips
        required: false
        default: true
        type: boolean
      semantic_search_url:
        description: Semantic Search asset URL compiled into the app
        required: false
        default: ""
        type: string
      semantic_search_sha256:
        description: Semantic Search asset sha256 compiled into the app
        required: false
        default: ""
        type: string
      semantic_search_size:
        description: Semantic Search asset byte size compiled into the app
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 scripts/resolve-release-version.py --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    name: Build Windows app
    needs: resolve
    if: ${{ inputs.include_windows }}
    uses: ./.github/workflows/build-windows-app.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      build_profile: release
      semantic_search_url: ${{ inputs.semantic_search_url }}
      semantic_search_sha256: ${{ inputs.semantic_search_sha256 }}
      semantic_search_size: ${{ inputs.semantic_search_size }}
      handoff_release_tag: ${{ needs.resolve.outputs.tag }}

  macos:
    name: Build macOS app
    needs: resolve
    if: ${{ inputs.include_macos }}
    uses: ./.github/workflows/build-macos-app.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      build_profile: release
      semantic_search_url: ${{ inputs.semantic_search_url }}
      semantic_search_sha256: ${{ inputs.semantic_search_sha256 }}
      semantic_search_size: ${{ inputs.semantic_search_size }}
      handoff_release_tag: ${{ needs.resolve.outputs.tag }}

  prune-release-caches:
    name: Prune release caches
    runs-on: ubuntu-latest
    needs:
      - resolve
      - windows
      - macos
    if: ${{ always() && (inputs.include_windows || inputs.include_macos) }}
    permissions:
      actions: write
      contents: read

    steps:
      - name: Keep latest release cache per platform
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_PROFILE: release
        run: |
          set -euo pipefail

          prune_cache_family() {
            local family="$1"
            mapfile -t stale_ids < <(
              gh cache list \
                --repo "$GITHUB_REPOSITORY" \
                --limit 100 \
                --json id,key,lastAccessedAt \
                --jq "sort_by(.lastAccessedAt) | reverse | map(select(.key | contains(\"${family}\"))) | .[1:] | .[].id"
            )

            for cache_id in "${stale_ids[@]}"; do
              gh cache delete "$cache_id" --repo "$GITHUB_REPOSITORY"
            done
          }

          if [[ "${{ inputs.include_macos }}" == "true" ]]; then
            prune_cache_family "release-macos-${BUILD_PROFILE}"
          fi

          if [[ "${{ inputs.include_windows }}" == "true" ]]; then
            prune_cache_family "release-windows-${BUILD_PROFILE}"
          fi

  package:
    name: Package release zips
    runs-on: ubuntu-latest
    needs:
      - resolve
      - windows
      - macos
    if: ${{ always() && needs.resolve.result == 'success' && (!inputs.include_windows || needs.windows.result == 'success') && (!inputs.include_macos || needs.macos.result == 'success') }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Package selected app builds
        id: package
        uses: ./.github/actions/package-release
        with:
          include_windows: ${{ inputs.include_windows }}
          include_macos: ${{ inputs.include_macos }}
          windows_build_tag: ${{ needs.resolve.outputs.tag }}
          macos_build_tag: ${{ needs.resolve.outputs.tag }}
          release_tag: ${{ needs.resolve.outputs.tag }}
          token: ${{ github.token }}

      - name: Write signing private key
        if: ${{ inputs.publish_update }}
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.include_macos }}" != "true" || "${{ inputs.include_windows }}" != "true" ]]; then
            echo "publish_update needs both platforms; latest.json lists one zip per platform" >&2
            exit 1
          fi
          if [[ -z "${MANIFEST_SIGNING_KEY:-}" ]]; then
            echo "MANIFEST_SIGNING_KEY secret is not configured" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/signing"
          chmod 700 "${RUNNER_TEMP}/signing"
          printf '%s\n' "$MANIFEST_SIGNING_KEY" > "${RUNNER_TEMP}/signing/private.pem"
          chmod 600 "${RUNNER_TEMP}/signing/private.pem"

      - name: Build and sign latest.json
        if: ${{ inputs.publish_update }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve.outputs.tag }}"
          version="${{ steps.package.outputs.version }}"
          released_at="${{ steps.package.outputs.released_at }}"

          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          macos_url="${base_url}/snappyref-mac-${tag}.zip"
          windows_url="${base_url}/snappyref-windows-${tag}.zip"

          scripts/build-signed-manifest.sh \
            --version "$version" \
            --released-at "$released_at" \
            --notes-url "${{ inputs.notes_url }}" \
            --macos-zip "${RUNNER_TEMP}/release-assets/snappyref-mac-${tag}.zip" \
            --macos-url "$macos_url" \
            --windows-zip "${RUNNER_TEMP}/release-assets/snappyref-windows-${tag}.zip" \
            --windows-url "$windows_url" \
            --private-key "${RUNNER_TEMP}/signing/private.pem" \
            --public-key docs/keys/signing-key.pub.pem \
            --output "${RUNNER_TEMP}/release-assets/latest.json"

      - name: Clean up signing key material
        if: ${{ always() }}
        run: |
          rm -rf "${RUNNER_TEMP}/signing"

      - name: Upload to source-repo draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=("${RUNNER_TEMP}"/release-assets/*.zip)
          # A dry run signs no latest.json.
          if [ -f "${RUNNER_TEMP}/release-assets/latest.json" ]; then
            assets+=("${RUNNER_TEMP}/release-assets/latest.json")
          fi
          scripts/upload-release-assets.sh "${{ needs.resolve.outputs.tag }}" "${{ needs.resolve.outputs.sha }}" "${assets[@]}"

      - name: Refresh SnappyRef web release data
        if: ${{ inputs.publish_update }}
        env:
          SNAPPYREF_WEB_RELEASE_REFRESH_URL: ${{ secrets.SNAPPYREF_WEB_RELEASE_REFRESH_URL }}
          SNAPPYREF_WEB_RELEASE_REFRESH_SECRET: ${{ secrets.SNAPPYREF_WEB_RELEASE_REFRESH_SECRET }}
        run: |
          set -euo pipefail

          if [[ -z "${SNAPPYREF_WEB_RELEASE_REFRESH_URL:-}" || -z "${SNAPPYREF_WEB_RELEASE_REFRESH_SECRET:-}" ]]; then
            echo "::notice::SnappyRef web release refresh secrets are not configured; skipping web refresh."
            exit 0
          fi

          tag="${{ needs.resolve.outputs.tag }}"
          payload="{\"tag\":\"${tag}\"}"

          curl --fail-with-body --show-error --silent \
            --request POST \
            --header "content-type: application/json" \
            --header "x-snappyref-release-refresh-secret: ${SNAPPYREF_WEB_RELEASE_REFRESH_SECRET}" \
            --data "$payload" \
            "$SNAPPYREF_WEB_RELEASE_REFRESH_URL"

      - name: Clean up release asset handoff files
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve.outputs.tag }}"
          names=(
            snappyref-windows-app.zip
            snappyref-windows-semantic-search-descriptor.env
            snappyref-macos-app.zip
            snappyref-macos-semantic-search-descriptor.env
          )

          for name in "${names[@]}"; do
            gh release delete-asset "$tag" "$name" --yes 2>/dev/null || true
          done
