name: Build Artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  windows:
    name: Windows artifact
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install libjpeg-turbo
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          $vcpkgTriplet = "x64-windows-static-md"
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          & "$vcpkgRoot\bootstrap-vcpkg.bat"
          & "$vcpkgRoot\vcpkg.exe" install "libjpeg-turbo:$vcpkgTriplet"
          "TURBOJPEG_SOURCE=explicit" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TURBOJPEG_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TURBOJPEG_LIB_DIR=$vcpkgRoot\installed\$vcpkgTriplet\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TURBOJPEG_INCLUDE_DIR=$vcpkgRoot\installed\$vcpkgTriplet\include" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package artifact
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP "snappyref-windows-package"
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item target\release\snappyref.exe $packageRoot
          Copy-Item UPDATE.txt $packageRoot
          python scripts\fetch-semantic-model.py --target (Join-Path $packageRoot "models")
          $modelRoot = Join-Path $packageRoot "models\siglip2_base_patch16_224_int8"
          @(
            "tokenizer.json",
            "onnx\text_model_int8.onnx",
            "onnx\vision_model_int8.onnx"
          ) | ForEach-Object {
            $path = Join-Path $modelRoot $_
            if (-not (Test-Path $path)) {
              throw "missing packaged model asset: $path"
            }
          }
          $zipPath = Join-Path $env:RUNNER_TEMP "snappyref-windows-${{ github.sha }}.zip"
          Compress-Archive -Path "$packageRoot\*" -DestinationPath $zipPath -Force

      - name: Check archive contract
        shell: bash
        run: scripts/check-release-archive.sh "${RUNNER_TEMP}/snappyref-windows-${{ github.sha }}.zip" snappyref.exe

      - uses: actions/upload-artifact@v4
        with:
          name: snappyref-windows-${{ github.sha }}
          path: ${{ runner.temp }}/snappyref-windows-${{ github.sha }}.zip
          retention-days: 7

  macos:
    name: macOS artifact
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install libjpeg-turbo
        run: brew install jpeg-turbo

      - name: Configure turbojpeg
        run: |
          echo "TURBOJPEG_SOURCE=explicit" >> "$GITHUB_ENV"
          echo "TURBOJPEG_STATIC=1" >> "$GITHUB_ENV"
          echo "TURBOJPEG_LIB_DIR=$(brew --prefix jpeg-turbo)/lib" >> "$GITHUB_ENV"
          echo "TURBOJPEG_INCLUDE_DIR=$(brew --prefix jpeg-turbo)/include" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Verify turbojpeg is statically linked
        run: |
          if otool -L target/release/snappyref | tail -n +2 | grep -i turbojpeg; then
            echo "snappyref has a dynamic libturbojpeg dependency" >&2
            exit 1
          fi

      - name: Package artifact
        run: |
          zip_path="${RUNNER_TEMP}/snappyref-macos-${{ github.sha }}.zip"
          scripts/package-macos-artifact.sh "$zip_path"

      - name: Check archive contract
        run: scripts/check-release-archive.sh "${RUNNER_TEMP}/snappyref-macos-${{ github.sha }}.zip" SnappyRef.app/Contents/MacOS/snappyref

      - uses: actions/upload-artifact@v4
        with:
          name: snappyref-macos-${{ github.sha }}
          path: ${{ runner.temp }}/snappyref-macos-${{ github.sha }}.zip
          retention-days: 7
