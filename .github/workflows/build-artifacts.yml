name: Build Artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: main
        type: string
      artifact_profile:
        description: Build profile for manual artifacts
        required: false
        default: release-fast
        type: choice
        options:
          - release-fast
          - release
      publish_test_release:
        description: Publish a draft prerelease with direct zip downloads
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  windows:
    name: Windows artifact
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install libjpeg-turbo
        if: ${{ inputs.artifact_profile == 'release' }}
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          $vcpkgTriplet = "x64-windows-static-md"
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          & "$vcpkgRoot\bootstrap-vcpkg.bat"
          & "$vcpkgRoot\vcpkg.exe" install "libjpeg-turbo:$vcpkgTriplet"
          "TURBOJPEG_SOURCE=explicit" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TURBOJPEG_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TURBOJPEG_LIB_DIR=$vcpkgRoot\installed\$vcpkgTriplet\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TURBOJPEG_INCLUDE_DIR=$vcpkgRoot\installed\$vcpkgTriplet\include" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build release binary
        shell: pwsh
        run: |
          if ("${{ inputs.artifact_profile }}" -eq "release") {
            cargo build --release --locked
          } else {
            cargo build --profile release-fast --locked --no-default-features --features semantic-search
          }

      - name: Verify Windows GUI subsystem
        shell: pwsh
        run: |
          $targetDir = if ("${{ inputs.artifact_profile }}" -eq "release") { "target\release" } else { "target\release-fast" }
          $exe = Join-Path $targetDir "snappyref.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          if ($subsystem -ne 2) {
            throw "expected Windows GUI subsystem 2, got $subsystem"
          }

      - name: Package artifact
        shell: pwsh
        run: |
          $targetDir = if ("${{ inputs.artifact_profile }}" -eq "release") { "target\release" } else { "target\release-fast" }
          $artifactRoot = Join-Path $env:RUNNER_TEMP "snappyref-windows-artifact"
          $packageRoot = Join-Path $artifactRoot "SnappyRef"
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item (Join-Path $targetDir "snappyref.exe") $packageRoot
          Copy-Item UPDATE.txt $packageRoot
          python scripts\fetch-semantic-model.py --target (Join-Path $packageRoot "models")
          $modelRoot = Join-Path $packageRoot "models\siglip2_base_patch16_224_int8"
          @(
            "tokenizer.json",
            "onnx\text_model_int8.onnx",
            "onnx\vision_model_int8.onnx"
          ) | ForEach-Object {
            $path = Join-Path $modelRoot $_
            if (-not (Test-Path $path)) {
              throw "missing packaged model asset: $path"
            }
          }
          $zipPath = Join-Path $env:RUNNER_TEMP "snappyref-windows-${{ github.sha }}.zip"
          Compress-Archive -Path $packageRoot -DestinationPath $zipPath -Force

      - name: Check archive contract
        shell: bash
        run: scripts/check-release-archive.sh "${RUNNER_TEMP}/snappyref-windows-${{ github.sha }}.zip" SnappyRef/snappyref.exe

      - uses: actions/upload-artifact@v4
        with:
          name: snappyref-windows-${{ github.sha }}
          path: ${{ runner.temp }}/snappyref-windows-artifact
          retention-days: 7

  macos:
    name: macOS artifact
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install libjpeg-turbo
        if: ${{ inputs.artifact_profile == 'release' }}
        run: brew install jpeg-turbo

      - name: Configure turbojpeg
        if: ${{ inputs.artifact_profile == 'release' }}
        run: |
          echo "TURBOJPEG_SOURCE=explicit" >> "$GITHUB_ENV"
          echo "TURBOJPEG_STATIC=1" >> "$GITHUB_ENV"
          echo "TURBOJPEG_LIB_DIR=$(brew --prefix jpeg-turbo)/lib" >> "$GITHUB_ENV"
          echo "TURBOJPEG_INCLUDE_DIR=$(brew --prefix jpeg-turbo)/include" >> "$GITHUB_ENV"

      - name: Build release binary
        run: |
          if [[ "${{ inputs.artifact_profile }}" == "release" ]]; then
            cargo build --release --locked
          else
            cargo build --profile release-fast --locked --no-default-features --features semantic-search
          fi

      - name: Verify turbojpeg is statically linked
        if: ${{ inputs.artifact_profile == 'release' }}
        run: |
          if otool -L target/release/snappyref | tail -n +2 | grep -i turbojpeg; then
            echo "snappyref has a dynamic libturbojpeg dependency" >&2
            exit 1
          fi

      - name: Package artifact
        run: |
          if [[ "${{ inputs.artifact_profile }}" == "release" ]]; then
            binary_path="target/release/snappyref"
          else
            binary_path="target/release-fast/snappyref"
          fi
          mkdir -p target/release
          cp "$binary_path" target/release/snappyref
          zip_path="${RUNNER_TEMP}/snappyref-macos-${{ github.sha }}.zip"
          scripts/package-macos-artifact.sh "$zip_path"

      - name: Check archive contract
        run: scripts/check-release-archive.sh "${RUNNER_TEMP}/snappyref-macos-${{ github.sha }}.zip" SnappyRef.app/Contents/MacOS/snappyref

      - uses: actions/upload-artifact@v4
        with:
          name: snappyref-macos-${{ github.sha }}
          path: ${{ runner.temp }}/snappyref-macos-${{ github.sha }}.zip
          retention-days: 7

  test-release:
    name: Publish test release
    runs-on: ubuntu-latest
    needs:
      - windows
      - macos
    if: ${{ inputs.publish_test_release }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail
          release_assets="${RUNNER_TEMP}/release-assets"
          mkdir -p "$release_assets"

          windows_root=$(find "${RUNNER_TEMP}/artifacts" -type d -name SnappyRef | head -n 1)
          if [[ -z "$windows_root" ]]; then
            echo "missing downloaded Windows SnappyRef folder" >&2
            exit 1
          fi
          (cd "$(dirname "$windows_root")" && zip -9 -r "$release_assets/snappyref-windows-${{ github.sha }}.zip" SnappyRef)

          macos_zip=$(find "${RUNNER_TEMP}/artifacts" -type f -name 'snappyref-macos-${{ github.sha }}.zip' | head -n 1)
          if [[ -z "$macos_zip" ]]; then
            echo "missing downloaded macOS release zip" >&2
            exit 1
          fi
          cp "$macos_zip" "$release_assets/"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          target_commitish: ${{ inputs.ref }}
          name: Test build ${{ github.run_number }}
          draft: true
          prerelease: true
          files: ${{ runner.temp }}/release-assets/*.zip
