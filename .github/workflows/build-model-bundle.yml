name: Build Model Bundle

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build packaging scripts from
        required: false
        default: main
        type: string
      tag_name:
        description: Release tag that stores the reusable model bundle
        required: false
        default: models-siglip2-base-patch16-224-int8
        type: string
      save_as_reusable_model_bundle:
        description: Save bundle to a durable GitHub Release for future packages
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  models:
    name: Build model bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Create model bundle
        run: |
          zip_path="${RUNNER_TEMP}/snappyref-models-siglip2_base_patch16_224_int8.zip"
          scripts/create-model-bundle.sh "$zip_path"

      - uses: actions/upload-artifact@v4
        with:
          name: snappyref-models-siglip2_base_patch16_224_int8
          path: ${{ runner.temp }}/snappyref-models-siglip2_base_patch16_224_int8.zip
          retention-days: 7

      - name: Save reusable model bundle
        if: ${{ inputs.save_as_reusable_model_bundle }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag_name }}"
          zip_path="${RUNNER_TEMP}/snappyref-models-siglip2_base_patch16_224_int8.zip"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "${{ inputs.ref }}" \
              --title "SnappyRef model bundle: siglip2_base_patch16_224_int8" \
              --notes "Reusable SnappyRef semantic-search model bundle." \
              --prerelease
          fi

          gh release upload "$tag" "$zip_path" --clobber
