name: Build Windows App

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: main
        type: string
      build_profile:
        description: Build profile
        required: false
        default: release-fast
        type: choice
        options:
          - release-fast
          - release
      semantic_search_url:
        description: Compiled Semantic Search asset URL
        required: false
        default: ""
        type: string
      semantic_search_sha256:
        description: Compiled Semantic Search asset sha256
        required: false
        default: ""
        type: string
      semantic_search_size:
        description: Compiled Semantic Search asset byte size
        required: false
        default: ""
        type: string
      handoff_release_tag:
        description: Source-repo draft release tag for reusable app build handoff
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      ref:
        required: false
        default: main
        type: string
      build_profile:
        required: false
        default: release
        type: string
      semantic_search_url:
        required: false
        default: ""
        type: string
      semantic_search_sha256:
        required: false
        default: ""
        type: string
      semantic_search_size:
        required: false
        default: ""
        type: string
      handoff_release_tag:
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows app
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve release version
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.handoff_release_tag }}
        run: python scripts/resolve-release-version.py --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-${{ inputs.build_profile }}
          add-job-id-key: false
          cache-bin: false
          save-if: true

      - name: Install libjpeg-turbo
        if: ${{ inputs.build_profile == 'release' }}
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          $vcpkgTriplet = "x64-windows-static-md"
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          & "$vcpkgRoot\bootstrap-vcpkg.bat"
          & "$vcpkgRoot\vcpkg.exe" install "libjpeg-turbo:$vcpkgTriplet"
          "TURBOJPEG_SOURCE=explicit" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TURBOJPEG_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TURBOJPEG_LIB_DIR=$vcpkgRoot\installed\$vcpkgTriplet\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TURBOJPEG_INCLUDE_DIR=$vcpkgRoot\installed\$vcpkgTriplet\include" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Resolve Semantic Search descriptor
        shell: bash
        env:
          SNAPPYREF_SEMANTIC_SEARCH_URL: ${{ inputs.semantic_search_url }}
          SNAPPYREF_SEMANTIC_SEARCH_SHA256: ${{ inputs.semantic_search_sha256 }}
          SNAPPYREF_SEMANTIC_SEARCH_SIZE: ${{ inputs.semantic_search_size }}
        run: |
          python scripts/semantic-search-descriptor.py resolve \
            --output "$RUNNER_TEMP/semantic-search-descriptor/semantic-search-descriptor.env" \
            --github-env "$GITHUB_ENV"

      - name: Build app binary
        shell: pwsh
        run: |
          if ("${{ inputs.build_profile }}" -eq "release") {
            cargo build --release --locked --bin snappyref
            "SNAPPYREF_TARGET_DIR=target\release" | Out-File -FilePath $env:GITHUB_ENV -Append
          } elseif ("${{ inputs.build_profile }}" -eq "release-fast") {
            cargo build --profile release-fast --locked --no-default-features --bin snappyref
            "SNAPPYREF_TARGET_DIR=target\release-fast" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            throw "unsupported build profile"
          }

      - name: Verify Windows GUI subsystem
        shell: pwsh
        run: |
          $exe = Join-Path $env:SNAPPYREF_TARGET_DIR "snappyref.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          if ($subsystem -ne 2) {
            throw "expected Windows GUI subsystem 2, got $subsystem"
          }

      - name: Package app artifact
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP ([Guid]::NewGuid().ToString())
          $packageRoot = Join-Path $scratch "SnappyRef"
          try {
            New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
            Copy-Item (Join-Path $env:SNAPPYREF_TARGET_DIR "snappyref.exe") $packageRoot
            python scripts/third_party_notices.py (Join-Path $packageRoot "THIRD_PARTY_NOTICES.txt")
            if ($LASTEXITCODE -ne 0) { throw "failed to write third-party notices" }
            Copy-Item `
              (Join-Path $env:RUNNER_TEMP "semantic-search-descriptor\semantic-search-descriptor.env") `
              (Join-Path $env:RUNNER_TEMP "snappyref-windows-semantic-search-descriptor.env")
            Compress-Archive `
              -Path $packageRoot `
              -DestinationPath (Join-Path $env:RUNNER_TEMP "snappyref-windows-app.zip") `
              -Force
          } finally { Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction SilentlyContinue }

      - name: Upload app handoff release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = "${{ steps.release.outputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "handoff_release_tag is required"
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --target "${{ inputs.ref }}" `
              --title "SnappyRef $tag" `
              --notes "Draft SnappyRef release." `
              --draft
            if ($LASTEXITCODE -ne 0) {
              gh release view $tag *> $null
              if ($LASTEXITCODE -ne 0) {
                throw "failed to create or find release $tag"
              }
            }
          }

          gh release upload $tag `
            (Join-Path $env:RUNNER_TEMP "snappyref-windows-app.zip") `
            (Join-Path $env:RUNNER_TEMP "snappyref-windows-semantic-search-descriptor.env") `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "failed to upload release handoff assets"
          }
