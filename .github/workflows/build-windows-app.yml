name: Build Windows App

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: main
        type: string
      build_profile:
        description: Build profile
        required: false
        default: release-fast
        type: choice
        options:
          - release-fast
          - release
      semantic_search_url:
        description: Compiled Semantic Search asset URL
        required: false
        default: https://github.com/noelcserepy/snappyref-dist/releases/download/semantic-search/snappyref-semantic-search.zip
        type: string
      semantic_search_sha256:
        description: Compiled Semantic Search asset sha256
        required: true
        type: string
      semantic_search_size:
        description: Compiled Semantic Search asset byte size
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        required: false
        default: main
        type: string
      build_profile:
        required: false
        default: release
        type: string
      semantic_search_url:
        required: false
        default: https://github.com/noelcserepy/snappyref-dist/releases/download/semantic-search/snappyref-semantic-search.zip
        type: string
      semantic_search_sha256:
        required: true
        type: string
      semantic_search_size:
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows app
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-${{ inputs.build_profile }}
          add-job-id-key: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install libjpeg-turbo
        if: ${{ inputs.build_profile == 'release' }}
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          $vcpkgTriplet = "x64-windows-static-md"
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          & "$vcpkgRoot\bootstrap-vcpkg.bat"
          & "$vcpkgRoot\vcpkg.exe" install "libjpeg-turbo:$vcpkgTriplet"
          "TURBOJPEG_SOURCE=explicit" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TURBOJPEG_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TURBOJPEG_LIB_DIR=$vcpkgRoot\installed\$vcpkgTriplet\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TURBOJPEG_INCLUDE_DIR=$vcpkgRoot\installed\$vcpkgTriplet\include" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build app binary
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ inputs.semantic_search_sha256 }}") -or [string]::IsNullOrWhiteSpace("${{ inputs.semantic_search_size }}")) {
            throw "Semantic Search descriptor inputs are required for release app builds."
          }
          $env:SNAPPYREF_SEMANTIC_SEARCH_URL = "${{ inputs.semantic_search_url }}"
          $env:SNAPPYREF_SEMANTIC_SEARCH_SHA256 = "${{ inputs.semantic_search_sha256 }}"
          $env:SNAPPYREF_SEMANTIC_SEARCH_SIZE = "${{ inputs.semantic_search_size }}"
          if ("${{ inputs.build_profile }}" -eq "release") {
            cargo build --release --locked --bins
            "SNAPPYREF_TARGET_DIR=target\release" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            cargo build --profile release-fast --locked --no-default-features --features semantic-search --bins
            "SNAPPYREF_TARGET_DIR=target\release-fast" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Write Semantic Search descriptor artifact
        shell: pwsh
        run: |
          $descriptorDir = Join-Path $env:RUNNER_TEMP "semantic-search-descriptor"
          New-Item -ItemType Directory -Force -Path $descriptorDir | Out-Null
          $descriptorPath = Join-Path $descriptorDir "semantic-search-descriptor.env"
          @(
            "semantic_search_url=${{ inputs.semantic_search_url }}"
            "semantic_search_sha256=${{ inputs.semantic_search_sha256 }}"
            "semantic_search_size=${{ inputs.semantic_search_size }}"
          ) | Set-Content -Path $descriptorPath -NoNewline:$false

      - name: Verify Windows GUI subsystem
        shell: pwsh
        run: |
          $exe = Join-Path $env:SNAPPYREF_TARGET_DIR "snappyref.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          if ($subsystem -ne 2) {
            throw "expected Windows GUI subsystem 2, got $subsystem"
          }

      - name: Package app artifact
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP "snappyref-windows-app\SnappyRef"
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item (Join-Path $env:SNAPPYREF_TARGET_DIR "snappyref.exe") $packageRoot
          # Ship the auto-update helper alongside the main exe. ADR-0015:
          # the helper lives at SnappyRef/snappyref-updater.exe.
          Copy-Item (Join-Path $env:SNAPPYREF_TARGET_DIR "snappyref-updater.exe") $packageRoot

      - uses: actions/upload-artifact@v4
        with:
          name: snappyref-windows-app
          path: ${{ runner.temp }}/snappyref-windows-app
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: snappyref-windows-semantic-search-descriptor
          path: ${{ runner.temp }}/semantic-search-descriptor/semantic-search-descriptor.env
          retention-days: 7
