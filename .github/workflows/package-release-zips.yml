name: Package Release Zips

on:
  workflow_dispatch:
    inputs:
      include_windows:
        description: Package Windows zip
        required: false
        default: true
        type: boolean
      include_macos:
        description: Package macOS zip
        required: false
        default: true
        type: boolean
      windows_build_tag:
        description: Existing Windows build release tag; blank uses release_tag
        required: false
        default: ""
        type: string
      macos_build_tag:
        description: Existing macOS build release tag; blank uses release_tag
        required: false
        default: ""
        type: string
      create_draft_release:
        description: Attach final zips to a draft GitHub Release
        required: false
        default: false
        type: boolean
      release_tag:
        description: Release tag used when create_draft_release is true
        required: false
        default: v0.2.0
        type: string
  workflow_call:
    inputs:
      include_windows:
        required: false
        default: true
        type: boolean
      include_macos:
        required: false
        default: true
        type: boolean
      windows_build_tag:
        required: false
        default: ""
        type: string
      macos_build_tag:
        required: false
        default: ""
        type: string
      create_draft_release:
        required: false
        default: false
        type: boolean
      release_tag:
        required: false
        default: v0.2.0
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package release zips
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Package selected app builds
        uses: ./.github/actions/package-release
        with:
          include_windows: ${{ inputs.include_windows }}
          include_macos: ${{ inputs.include_macos }}
          windows_build_tag: ${{ inputs.windows_build_tag || inputs.release_tag }}
          macos_build_tag: ${{ inputs.macos_build_tag || inputs.release_tag }}
          release_tag: ${{ inputs.release_tag }}
          token: ${{ github.token }}

      - name: Create draft release
        if: ${{ inputs.create_draft_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "SnappyRef $tag" \
              --notes "Draft SnappyRef release." \
              --draft
          fi
          gh release upload "$tag" "${RUNNER_TEMP}"/release-assets/*.zip --clobber
